<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Matheus Ortiz Fitness">
    <meta name="format-detection" content="telephone=no">
    
    <link rel="apple-touch-icon" href="icone.jpg?v=2">
    <link rel="icon" type="image/jpeg" href="icone.jpg?v=2">
    
    <title>Matheus Ortiz Fitness // CyberGym OS</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/digital-7-mono" rel="stylesheet">
    
    <style>
        :root {
            --primary: #ff1836;
            --primary-glow: rgba(255, 24, 54, 0.7);
            --success: #00ff66;
            --success-glow: rgba(0, 255, 102, 0.6);
            --accent-orange: #ff6a00;
            --bg-dark: #07070a;
            --card-bg: rgba(22, 22, 30, 0.7);
            --border-color: rgba(255, 24, 54, 0.2);
            --text-main: #ffffff;
            --text-muted: #9fa0b1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255, 24, 54, 0.08) 0%, transparent 50%),
                linear-gradient(rgba(7, 7, 10, 0.95), rgba(7, 7, 10, 0.98)),
                url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=1000&auto=format&fit=crop');
            background-size: cover, cover, cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            padding: env(safe-area-inset-top, 20px) 12px 80px 12px;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
            overflow-x: hidden;
        }

        /* Barra de Varredura (Scanner) Suave e Vermelha */
        .scanline {
            position: fixed;
            top: -10%; left: 0; width: 100%; height: 2px;
            background: var(--primary);
            box-shadow: 0 0 15px 3px var(--primary-glow);
            opacity: 0.4;
            animation: scan 6s linear infinite;
            pointer-events: none;
            z-index: 9999;
        }
        @keyframes scan {
            0% { top: -10%; }
            100% { top: 110%; }
        }

        header { width: 100%; max-width: 500px; text-align: center; margin-bottom: 20px; padding-top: 12px; z-index: 20; }
        .logo-container { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 6px; }
        .dumbbell-icon { width: 34px; height: 34px; color: var(--primary); filter: drop-shadow(0 0 12px var(--primary-glow)); }

        /* Animação do Texto do Cabeçalho Piscando */
        @keyframes tech-blink {
            0%, 100% { opacity: 1; text-shadow: 0 0 8px var(--primary-glow); }
            35% { opacity: 1; }
            36% { opacity: 0.3; text-shadow: none; }
            38% { opacity: 1; }
            40% { opacity: 0.3; text-shadow: none; }
            42% { opacity: 1; }
            70% { opacity: 1; }
            71% { opacity: 0.5; }
            72% { opacity: 1; }
        }

        h1 { font-family: 'Teko', sans-serif; font-size: 28px; letter-spacing: 2px; color: #fff; text-transform: uppercase; line-height: 1; animation: tech-blink 5s infinite; }
        h1 span { color: var(--primary); }
        .subtitle { font-size: 9px; letter-spacing: 3px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; margin-bottom: 12px; }

        .app-screen { width: 100%; max-width: 500px; z-index: 20; display: none; flex-direction: column; opacity: 0; transition: opacity 0.3s ease; }
        .app-screen.active { display: flex; opacity: 1; }

        /* NAVEGAÇÃO INFERIOR */
        .main-nav-container {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(10, 10, 15, 0.92); backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.05);
            display: flex; justify-content: space-around;
            padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px));
            z-index: 9000; box-shadow: 0 -5px 25px rgba(0,0,0,0.8);
        }
        .nav-tab { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-muted); cursor: pointer; flex: 1; transition: all 0.2s; }
        .nav-tab.active { color: var(--accent-orange); }
        .nav-tab svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; transition: transform 0.2s;}
        .nav-tab.active svg { stroke: var(--accent-orange); transform: scale(1.1); }
        .nav-label { font-size: 9px; font-weight: 700; letter-spacing: 0.5px; }

        /* MENU INICIAL */
        .menu-list { display: flex; flex-direction: column; gap: 12px; width: 100%; padding-bottom: 30px; }
        .menu-item { background: linear-gradient(145deg, #181824 0%, #101018 100%); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 14px; padding: 18px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s; position: relative; overflow: hidden; box-shadow: 0 6px 18px rgba(0,0,0,0.4); }
        .menu-item::before { content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%); height: 60%; width: 4px; border-radius: 0 6px 6px 0; background: var(--primary); box-shadow: 2px 0 10px var(--primary-glow); }
        .menu-item:hover, .menu-item:active { background: linear-gradient(145deg, #1c1c2a 0%, #13131d 100%); border-color: rgba(255, 24, 54, 0.3); transform: scale(1.02) translateY(-2px); }
        .menu-info { display: flex; flex-direction: column; gap: 8px; position: relative; z-index: 2; }
        .menu-day-name { font-family: 'Teko', sans-serif; font-size: 26px; color: #ffffff; letter-spacing: 1px; line-height: 1; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .menu-tags { display: flex; gap: 6px; align-items: center; flex-wrap: wrap;}
        .menu-region-badge { font-size: 9px; font-weight: 800; text-transform: uppercase; background: rgba(255, 24, 54, 0.15); color: #ff4d63; padding: 4px 8px; border-radius: 6px; border: 1px solid rgba(255, 24, 54, 0.3); letter-spacing: 1px;}
        .menu-ex-count { font-size: 9px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); background: rgba(255, 255, 255, 0.05); padding: 4px 8px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.1); letter-spacing: 0.5px;}
        .menu-action { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; transition: all 0.3s; }
        .menu-item:hover .menu-action { background: rgba(255, 24, 54, 0.15); border-color: var(--primary); }
        .menu-chevron { color: var(--text-muted); font-size: 16px; font-weight: bold; transition: color 0.3s;}
        .menu-item:hover .menu-chevron { color: var(--primary); }

        /* GAVETA DE TREINO */
        .workout-nav-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 12px; }
        .btn-back { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s; }
        .btn-back:active { background: rgba(255, 255, 255, 0.1); transform: scale(0.95); }
        .workout-title { font-family: 'Teko', sans-serif; font-size: 24px; color: var(--primary); text-shadow: 0 0 10px var(--primary-glow); letter-spacing: 1px; line-height: 1;}
        .workout-container { display: flex; flex-direction: column; gap: 14px; width: 100%; padding-bottom: 130px; }
        
        .cardio-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 14px; backdrop-filter: blur(12px); box-shadow: 0 6px 20px rgba(0,0,0,0.5); position: relative; overflow: hidden; }
        .cardio-card::before { content: ''; position: absolute; left: 0; top: 0; height: 100%; width: 3px; background: var(--primary); box-shadow: 0 0 10px var(--primary); }
        .cardio-header { font-family: 'Teko', sans-serif; font-size: 20px; color: #ff6b7d; letter-spacing: 1.5px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px;}
        .cardio-inputs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .cardio-input-group { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 6px; padding: 6px; display: flex; flex-direction: column; }
        .cardio-input-group label { font-size: 8px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; margin-bottom: 4px; letter-spacing: 0.5px;}
        .cardio-input-group input { background: transparent; border: none; color: #fff; font-size: 14px; font-weight: 800; width: 100%; outline: none; text-shadow: none; }

        .exercise-card { background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 14px; padding: 16px 12px; backdrop-filter: blur(12px); box-shadow: 0 6px 20px rgba(0,0,0,0.4); transition: border-color 0.3s; }
        .exercise-card:hover { border-color: rgba(255, 255, 255, 0.2); }
        .exercise-name { font-family: 'Teko', sans-serif; font-size: 20px; letter-spacing: 1px; color: #ffffff; margin-bottom: 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); padding-bottom: 8px; display: flex; align-items: center; }
        .btn-history { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 6px; padding: 5px 8px; font-size: 10px; font-family: 'Montserrat', sans-serif; cursor: pointer; margin-left: auto; transition: all 0.2s; font-weight: 700; display: flex; align-items: center; gap: 4px;}
        
        .sets-header { display: grid; grid-template-columns: 28px 1fr 1fr 32px; gap: 8px; padding: 0 4px 6px 4px; border-bottom: 1px solid rgba(255,255,255,0.05); margin-bottom: 8px; font-size: 9px; color: var(--text-muted); font-weight: 800; text-transform: uppercase; text-align: center;}
        .sets-list { display: flex; flex-direction: column; gap: 8px; }
        .set-row { display: grid; grid-template-columns: 28px 1fr 1fr 32px; gap: 8px; align-items: center; background: rgba(0, 0, 0, 0.3); border: 1px solid transparent; padding: 6px 4px; border-radius: 8px; transition: all 0.3s ease; }
        @keyframes cyber-flash { 0% { background: rgba(0, 255, 102, 0.2); } 100% { background: rgba(0, 255, 102, 0.05); } }
        .set-row.completed { animation: cyber-flash 0.5s ease-out forwards; border-color: rgba(0, 255, 102, 0.3); }
        .set-label { font-size: 12px; color: var(--text-muted); font-weight: 800; text-align: center; background: rgba(255,255,255,0.05); border-radius: 4px; padding: 6px 0; }
        .set-row.completed .set-label { background: rgba(0, 255, 102, 0.15); color: var(--success); }
        
        .control-group { display: flex; align-items: center; justify-content: space-between; background: rgba(255, 255, 255, 0.03); border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.08); overflow: hidden; }
        .btn-adjust { background: transparent; border: none; color: var(--text-muted); width: 28px; height: 32px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        input.val-input { width: 100%; text-align: center; font-size: 14px; font-weight: 800; color: #ffffff; background: transparent; border: none; padding: 0; outline: none; -moz-appearance: textfield; }
        
        .check-btn { width: 30px; height: 30px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.15); background: rgba(0,0,0,0.5); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.25s ease; color: transparent; font-size: 14px; margin: 0 auto;}
        .check-btn.checked { background: var(--success); border-color: var(--success); color: #000; box-shadow: 0 0 10px var(--success-glow); }

        #timerWrapper { width: 100%; margin: 8px 0; }
        .hardware-timer { background: #0a0a0c; border: 1px solid #222; border-radius: 10px; padding: 8px; box-shadow: inset 0 0 10px rgba(0,0,0,1), 0 4px 15px rgba(0,0,0,0.5); position: relative; display: flex; flex-direction: column; align-items: center; }
        .hardware-screen { background: #060000; width: 100%; border-radius: 6px; padding: 8px 0; border: 1px solid #1a0000; box-shadow: inset 0 0 15px rgba(0,0,0,1); text-align: center; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        .hardware-screen::before { content: "88:88:88"; position: absolute; font-family: 'Digital-7 Mono', sans-serif; font-size: 48px; color: #120000; z-index: 1; letter-spacing: 2px; pointer-events: none; user-select: none; line-height: 1; }
        .timer-display { font-family: 'Digital-7 Mono', sans-serif; font-size: 48px; color: #ff0a25; text-shadow: 0 0 8px #ff0a25; line-height: 1; letter-spacing: 2px; position: relative; z-index: 2; }
        .hardware-branding { position: absolute; bottom: 4px; width: 100%; display: flex; justify-content: space-between; padding: 0 12px; font-size: 8px; color: #666; font-weight: 800; letter-spacing: 1px; }
        .timer-controls-inline { display: flex; gap: 8px; justify-content: center; margin-top: 10px; width: 100%; }
        .timer-btn-inline { flex: 1; background: rgba(35, 35, 42, 0.9); border: 1px solid rgba(255, 255, 255, 0.1); color: #ddd; font-family: 'Teko', sans-serif; font-size: 16px; padding: 6px 0; border-radius: 6px; cursor: pointer; transition: all 0.2s; letter-spacing: 1px;}
        
        .bottom-actions-container { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(7, 7, 10, 0.95); backdrop-filter: blur(15px); border-top: 1px solid rgba(255,255,255,0.05); padding: 12px 12px calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; z-index: 100; box-shadow: 0 -10px 40px rgba(0,0,0,0.9); }
        .secondary-actions { display: flex; gap: 10px; }
        .action-btn { flex: 1; padding: 10px; border-radius: 8px; font-family: 'Teko', sans-serif; font-size: 16px; cursor: pointer; border: none; text-transform: uppercase; letter-spacing: 1px; }
        .btn-copy { background: rgba(255, 24, 54, 0.15); color: var(--primary); border: 1px solid rgba(255, 24, 54, 0.3); }
        .btn-reset { background: rgba(255, 255, 255, 0.05); color: var(--text-muted); border: 1px solid rgba(255, 255, 255, 0.1); }
        .btn-save { background: linear-gradient(135deg, var(--primary), #8a0014); color: #fff; font-size: 20px; padding: 12px; box-shadow: 0 4px 15px rgba(255,24,54,0.4); border: 1px solid #ff5c73; border-radius: 8px;}

        /* MODAL E TOASTS */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; z-index: 100000; opacity: 0; pointer-events: none; transition: 0.3s ease; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content { background: #16161e; border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; width: 90%; max-width: 350px; padding: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.8); max-height: 85vh; display: flex; flex-direction: column; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 10px; }
        .modal-title { font-family: 'Teko', sans-serif; font-size: 22px; color: #fff; letter-spacing: 1px; line-height: 1;}
        .close-btn { background: transparent; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; transition: color 0.2s; line-height: 1; }
        
        .input-history-box { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.05); border-radius: 10px; padding: 14px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 10px; }
        .input-history-box label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px;}
        .input-row-flex { display: flex; gap: 8px; width: 100%; }
        .input-row-flex input { flex: 1; min-width: 0; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: #fff; font-size: 14px; font-weight: bold; padding: 10px; text-align: center; outline: none; }
        .btn-add-weight { flex-shrink: 0; background: var(--primary); color: #fff; border: none; border-radius: 6px; padding: 0 14px; font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 700; cursor: pointer; letter-spacing: 0.5px; }
        
        .history-list-title { font-size: 10px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; margin-bottom: 8px; letter-spacing: 0.5px;}
        .history-list { overflow-y: auto; display: flex; flex-direction: column; gap: 6px; max-height: 220px; padding-right: 4px;}
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); border-radius: 6px; color: #fff; font-size: 13px; font-weight: 600;}
        .history-item span:first-child { color: var(--text-muted); font-size: 11px;}
        .history-item span:last-child { color: #fff; font-weight: 700; font-size: 14px;}
        .history-item.empty { display: block; text-align: center; color: var(--text-muted); background: transparent; border: none; padding: 16px 0; font-size: 12px; font-weight: 500;}

        #toast { position: fixed; top: 30px; background: rgba(0, 255, 102, 0.95); color: #000; padding: 12px 24px; border-radius: 30px; font-weight: 800; font-size: 12px; box-shadow: 0 8px 25px var(--success-glow); transform: translateY(-200px); transition: transform 0.3s ease; z-index: 100000; letter-spacing: 0.5px; text-align: center;}
        #toast.show { transform: translateY(0); }
    </style>
</head>
<body>

    <div class="scanline"></div>

    <header id="mainHeader">
        <div class="logo-container">
            <svg class="dumbbell-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
               <path d="M20.5 8.5V15.5C20.5 16.3 19.8 17 19 17H18V19C18 19.6 17.6 20 17 20H15C14.4 20 14 19.6 14 19V15H10V19C10 19.6 9.6 20 9 20H7C6.4 20 6 19.6 6 19V17H5C4.2 17 3.5 16.3 3.5 15.5V8.5C3.5 7.7 4.2 7 5 7H6V5C6 4.4 6.4 4 7 4H9C9.6 4 10 4.4 10 5V9H14V5C14 4.4 14.4 4 15 4H17C17.6 4 18 4.4 18 5V7H19C19.8 7 20.5 7.7 20.5 8.5Z"/>
            </svg>
            <h1>Matheus Ortiz <span>Fitness</span></h1>
        </div>
        <div class="subtitle">Cyberpunk Matrix // OS v10.11 FINAL</div>
    </header>

    <!-- TELA PRINCIPAL -->
    <div id="homeScreen" class="app-screen active">
        <div class="menu-list" id="menuList"></div>
    </div>

    <!-- TELA DE TREINO - GAVETA INTERNA -->
    <div id="workoutScreen" class="app-screen">
        <div class="workout-nav-bar">
            <button class="btn-back" onclick="goHome()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                VOLTAR
            </button>
            <div class="workout-title" id="workoutTitleDisplay">Domingo</div>
        </div>

        <div class="workout-container" id="workoutView"></div>

        <div id="timerWrapper" style="display: none;">
            <div class="hardware-timer">
                <div class="hardware-screen">
                    <span class="timer-display" id="timerDisplay">00:00:00</span>
                </div>
                <div class="hardware-branding"><span>CYBERGYM</span><span>AH02</span></div>
            </div>
            <div class="timer-controls-inline">
                <button class="timer-btn-inline" onclick="startTimer(60)">60s</button>
                <button class="timer-btn-inline" onclick="startTimer(90)">90s</button>
                <button class="timer-btn-inline" onclick="startTimer(120)">120s</button>
                <button class="timer-btn-inline stop" onclick="stopTimer()">PARAR</button>
            </div>
        </div>

        <div class="bottom-actions-container" id="bottomActions" style="display: none;">
            <div class="secondary-actions">
                <button class="action-btn btn-reset" onclick="resetWorkout()">Zerar Dados</button>
                <button class="action-btn btn-copy" onclick="copyWorkoutReport()">Copiar</button>
            </div>
            <button class="action-btn btn-save" onclick="saveWorkoutHistory()">✓ FINALIZAR TREINO</button>
        </div>
    </div>

    <!-- NAVEGAÇÃO INFERIOR -->
    <div class="main-nav-container" id="mainNavContainer">
        <div class="nav-tab active" id="tabTreinos" onclick="switchMainTab('homeScreen')">
            <svg viewBox="0 0 24 24"><path d="M6.5 6.5v11m11-11v11m-13-9h14m-14 7h14m-3-11v14m-8-14v14" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="nav-label">Treinos</span>
        </div>
    </div>

    <!-- MODAL HISTÓRICO E TOASTS -->
    <div class="modal-overlay" id="historyModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="historyTitle">Nome do Exercício</div>
                <button class="close-btn" onclick="closeHistory()">×</button>
            </div>
            
            <div class="input-history-box">
                <label>Registrar Carga Máxima (KG)</label>
                <div class="input-row-flex">
                    <input type="number" id="manualKgInput" placeholder="Ex: 65,5" step="0.5">
                    <button class="btn-add-weight" onclick="addManualWeight()">SALVAR</button>
                </div>
            </div>

            <div class="history-list-title">Histórico de Evolução</div>
            <div class="history-list" id="historyList"></div>
        </div>
    </div>

    <div id="toast">MENSAGEM AQUI</div>

    <script>
        const workoutData = {
            "DOM": {
                dayName: "Domingo",
                region: "PUSH + ABS",
                cardio: { time: "20min", dist: "2,5km", kcal: "160 Kcal" },
                exercises: [

        function initApp() {
            const menuList = document.getElementById('menuList');
            menuList.innerHTML = '';
            
            Object.keys(workoutData).forEach(dayKey => {
                const day = workoutData[dayKey];
                const exCount = day.exercises.length; 
                const btn = document.createElement('div');
                btn.className = 'menu-item';
                btn.onclick = () => openDay(dayKey);
                
                btn.innerHTML = `
                    <div class="menu-info">
                        <span class="menu-day-name">${day.dayName}</span>
                        <div class="menu-tags">
                            <span class="menu-region-badge">${day.region}</span>
                            <span class="menu-ex-count">${exCount} EXERCÍCIOS</span>
                        </div>
                    </div>
                    <div class="menu-action">
                        <span class="menu-chevron">❯</span>
                    </div>
                `;
                menuList.appendChild(btn);
            });
        }

        function switchMainTab(targetScreenId) {
            document.getElementById('homeScreen').classList.remove('active');
            document.getElementById('workoutScreen').classList.remove('active');
            
            document.getElementById('tabTreinos').classList.toggle('active', targetScreenId === 'homeScreen');
            
            setTimeout(() => {
                document.getElementById('homeScreen').style.display = 'none';
                document.getElementById('workoutScreen').style.display = 'none';
                
                document.getElementById(targetScreenId).style.display = 'flex';
                setTimeout(() => document.getElementById(targetScreenId).classList.add('active'), 10);
            }, 300);
        }

        function openDay(dayKey) {
            currentDay = dayKey;
            document.getElementById('mainHeader').style.display = 'none'; 
            document.getElementById('mainNavContainer').style.display = 'none'; 
            document.getElementById('homeScreen').classList.remove('active');
            
            setTimeout(() => {
                document.getElementById('homeScreen').style.display = 'none';
                document.getElementById('workoutScreen').style.display = 'flex';
                document.getElementById('bottomActions').style.display = 'flex'; 
                document.getElementById('workoutTitleDisplay').innerText = workoutData[dayKey].dayName;
                renderWorkout(dayKey);
                
                void document.getElementById('workoutScreen').offsetWidth;
                document.getElementById('workoutScreen').classList.add('active');
            }, 300);
        }

        function goHome() {
            document.getElementById('workoutScreen').classList.remove('active');
            document.getElementById('bottomActions').style.display = 'none'; 
            
            setTimeout(() => {
                document.getElementById('workoutScreen').style.display = 'none';
                document.getElementById('mainHeader').style.display = 'block'; 
                document.getElementById('homeScreen').style.display = 'flex';
                document.getElementById('mainNavContainer').style.display = 'flex'; 
                
                void document.getElementById('homeScreen').offsetWidth;
                document.getElementById('homeScreen').classList.add('active');
                stopTimer();
            }, 300);
        }

        function renderWorkout(dayKey) {
            const container = document.getElementById('workoutView');
            const timerWrapper = document.getElementById('timerWrapper');
            
            container.appendChild(timerWrapper); 
            timerWrapper.style.display = 'none';
            container.innerHTML = '';
            
            const dayData = workoutData[dayKey];
            const savedTime = localStorage.getItem(`gym_6dias_${dayKey}_cardio_time`) || dayData.cardio.time;
            const savedDist = localStorage.getItem(`gym_6dias_${dayKey}_cardio_dist`) || dayData.cardio.dist;
            const savedKcal = localStorage.getItem(`gym_6dias_${dayKey}_cardio_kcal`) || dayData.cardio.kcal;

            const cardioCard = document.createElement('div');
            cardioCard.className = 'cardio-card';
            cardioCard.innerHTML = `
                <div class="cardio-header"><span>🔥 CARDIO SESSION</span></div>
                <div class="cardio-inputs">
                    <div class="cardio-input-group"><label>Tempo</label><input type="text" id="cardio_time" value="${savedTime}" oninput="saveCardio()"></div>
                    <div class="cardio-input-group"><label>Distância</label><input type="text" id="cardio_dist" value="${savedDist}" oninput="saveCardio()"></div>
                    <div class="cardio-input-group"><label>Calorias</label><input type="text" id="cardio_kcal" value="${savedKcal}" oninput="saveCardio()"></div>
                </div>
            `;
            container.appendChild(cardioCard);
            timerWrapper.style.display = 'block';
            container.appendChild(timerWrapper); 

            dayData.exercises.forEach((ex, exIdx) => {
                const card = document.createElement('div');
                card.className = 'exercise-card';
                
                let setsHtml = `
                    <div class="sets-header">
                        <div>Série</div>
                        <div>Carga (KG)</div>
                        <div>Repetições</div>
                        <div>OK</div>
                    </div>
                    <div class="sets-list">
                `;
                
                ex.sets.forEach((set, setIdx) => {
                    const saved = JSON.parse(localStorage.getItem(`gym_6dias_${dayKey}_ex${exIdx}_set${setIdx}`)) || { kg: set.kg, reps: set.reps, checked: false };
                    
                    setsHtml += `
                        <div class="set-row ${saved.checked ? 'completed' : ''}" id="row_${exIdx}_${setIdx}">
                            <div class="set-label">${setIdx + 1}</div>
                            
                            <div class="control-group">
                                <button class="btn-adjust" onclick="updateVal(${exIdx},${setIdx}, 'kg', -5)">-</button>
                                <input type="number" class="val-input" id="kg_${exIdx}_${setIdx}" value="${saved.kg}" onchange="saveState(${exIdx},${setIdx})" step="0.5">
                                <button class="btn-adjust" onclick="updateVal(${exIdx},${setIdx}, 'kg', 5)">+</button>
                            </div>
                            
                            <div class="control-group">
                                <button class="btn-adjust" onclick="updateVal(${exIdx},${setIdx}, 'reps', -1)">-</button>
                                <input type="number" class="val-input" id="reps_${exIdx}_${setIdx}" value="${saved.reps}" onchange="saveState(${exIdx},${setIdx})">
                                <button class="btn-adjust" onclick="updateVal(${exIdx},${setIdx}, 'reps', 1)">+</button>
                            </div>
                            
                            <button class="check-btn ${saved.checked ? 'checked' : ''}" id="check_${exIdx}_${setIdx}" onclick="toggleCheck(${exIdx},${setIdx})">✓</button>
                        </div>
                    `;
                });
                
                setsHtml += `</div>`; 

                card.innerHTML = `
                    <div class="exercise-name">
                        ${ex.name}
                        <button class="btn-history" onclick="showHistory('${ex.name}')">📈 HISTÓRICO</button>
                    </div>
                    ${setsHtml}
                `;
                container.appendChild(card);
            });
        }

        function saveCardio() {
            localStorage.setItem(`gym_6dias_${currentDay}_cardio_time`, document.getElementById('cardio_time').value);
            localStorage.setItem(`gym_6dias_${currentDay}_cardio_dist`, document.getElementById('cardio_dist').value);
            localStorage.setItem(`gym_6dias_${currentDay}_cardio_kcal`, document.getElementById('cardio_kcal').value);
        }

        function updateVal(exIdx, setIdx, field, delta) {
            const inputField = document.getElementById(`${field}_${exIdx}_${setIdx}`);
            let val = parseFloat(inputField.value.replace(',', '.')) || 0;
            val += delta;
            if (val < 0) val = 0; 
            inputField.value = parseFloat(val.toFixed(1)); 
            saveState(exIdx, setIdx);
        }

        function toggleCheck(exIdx, setIdx) {
            const checkBtn = document.getElementById(`check_${exIdx}_${setIdx}`);
            const row = document.getElementById(`row_${exIdx}_${setIdx}`);
            row.classList.remove('completed'); void row.offsetWidth; checkBtn.classList.toggle('checked');
            
            if (checkBtn.classList.contains('checked')) {
                row.classList.add('completed'); saveState(exIdx, setIdx);
                showToast("SÉRIE COMPUTADA", 1500);
            } else {
                saveState(exIdx, setIdx);
            }
        }

        function saveState(exIdx, setIdx) {
            const kg = parseFloat(document.getElementById(`kg_${exIdx}_${setIdx}`).value.replace(',', '.')) || 0;
            const reps = parseInt(document.getElementById(`reps_${exIdx}_${setIdx}`).value) || 0;
            const checked = document.getElementById(`check_${exIdx}_${setIdx}`).classList.contains('checked');
            localStorage.setItem(`gym_6dias_${currentDay}_ex${exIdx}_set${setIdx}`, JSON.stringify({ kg, reps, checked }));
        }

        function resetWorkout() {
            if(confirm(`Zerar registros de treino na ${workoutData[currentDay].dayName}?`)) {
                localStorage.removeItem(`gym_6dias_${currentDay}_cardio_time`);
                localStorage.removeItem(`gym_6dias_${currentDay}_cardio_dist`);
                localStorage.removeItem(`gym_6dias_${currentDay}_cardio_kcal`);
                workoutData[currentDay].exercises.forEach((ex, exIdx) => {
                    ex.sets.forEach((set, setIdx) => localStorage.removeItem(`gym_6dias_${currentDay}_ex${exIdx}_set${setIdx}`));
                });
                renderWorkout(currentDay);
            }
        }

                    report += `\n  - Série ${setIdx + 1}:${kgVal}
