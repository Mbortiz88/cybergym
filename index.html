<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="CyberGym OS" />
    <meta name="format-detection" content="telephone=no" />

    <title>Matheus Ortiz Fitness // CyberGym OS</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.cdnfonts.com/css/digital-7-mono"
      rel="stylesheet"
    />

    <style>
      :root {
        /* Paleta Cyberpunk Ultra-Neon */
        --primary: #ff003c;
        --primary-glow: rgba(255, 0, 60, 0.85);
        --primary-dark: #8a0020;
        --cyan: #00f3ff;
        --cyan-glow: rgba(0, 243, 255, 0.6);
        --success: #00ff66;
        --success-glow: rgba(0, 255, 102, 0.7);
        --bg-dark: #020203;
        --card-bg: rgba(10, 10, 15, 0.7);
        --card-border: rgba(0, 243, 255, 0.15);
        --text-main: #ffffff;
        --text-muted: #6b6e84;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Montserrat", sans-serif;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        background-color: var(--bg-dark);
        color: var(--text-main);
        padding: env(safe-area-inset-top, 20px) 16px 30px 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        overflow-x: hidden;
        position: relative;
      }

      /* TEXTURA CRT / HOLOGRAMA FIXA NO FUNDO */
      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background:
          linear-gradient(rgba(2, 2, 3, 0.95), rgba(2, 2, 3, 0.98)),
          repeating-linear-gradient(
            0deg,
            transparent,
            transparent 2px,
            rgba(0, 243, 255, 0.03) 2px,
            rgba(0, 243, 255, 0.03) 4px
          ),
          radial-gradient(
            circle at 50% 10%,
            rgba(255, 0, 60, 0.15) 0%,
            transparent 60%
          );
        z-index: -2;
        pointer-events: none;
      }

      /* SCANNER LASER COM RASTRO DE LUZ */
      body::after {
        content: "";
        position: fixed;
        top: -100px;
        left: 0;
        width: 100%;
        height: 80px;
        background: linear-gradient(
          to bottom,
          transparent,
          rgba(255, 0, 60, 0.1),
          rgba(0, 243, 255, 0.8)
        );
        border-bottom: 2px solid var(--cyan);
        box-shadow:
          0 5px 20px var(--cyan-glow),
          0 0 40px var(--primary-glow);
        animation: laserScan 7s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        z-index: -1;
        pointer-events: none;
        opacity: 0.6;
      }

      @keyframes laserScan {
        0% {
          transform: translateY(-100px);
          opacity: 0;
        }
        10% {
          opacity: 0.7;
        }
        90% {
          opacity: 0.7;
        }
        100% {
          transform: translateY(120vh);
          opacity: 0;
        }
      }

      input[type="number"]::-webkit-outer-spin-button,
      input[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type="number"] {
        -moz-appearance: textfield;
      }

      /* HEADER HUD */
      header {
        width: 100%;
        max-width: 600px;
        text-align: center;
        margin-bottom: 30px;
        padding-top: 15px;
        z-index: 20;
        position: relative;
      }

      /* Linhas decorativas do Header */
      header::before,
      header::after {
        content: "";
        position: absolute;
        top: 10px;
        width: 30px;
        height: 2px;
        background: var(--cyan);
        box-shadow: 0 0 8px var(--cyan-glow);
      }
      header::before {
        left: 0;
      }
      header::after {
        right: 0;
      }

      .logo-container {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 15px;
        margin-bottom: 8px;
      }
      .dumbbell-icon {
        width: 45px;
        height: 45px;
        color: var(--primary);
        filter: drop-shadow(0 0 15px var(--primary-glow));
        animation: cyber-pulse 1.5s infinite alternate;
      }

      @keyframes cyber-pulse {
        0% {
          transform: scale(1) translateY(0);
          filter: drop-shadow(0 0 10px var(--primary));
        }
        100% {
          transform: scale(1.05) translateY(-2px);
          filter: drop-shadow(0 0 25px var(--primary));
        }
      }

      h1 {
        font-family: "Teko", sans-serif;
        font-size: 46px;
        letter-spacing: 4px;
        color: #fff;
        text-transform: uppercase;
        line-height: 1;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
      }
      h1 span {
        color: var(--primary);
        text-shadow: 0 0 20px var(--primary-glow);
      }
      .subtitle {
        display: inline-block;
        font-size: 10px;
        letter-spacing: 8px;
        color: #000;
        background: var(--cyan);
        padding: 4px 12px;
        border-radius: 2px;
        text-transform: uppercase;
        font-weight: 900;
        box-shadow: 0 0 15px var(--cyan-glow);
        margin-top: 5px;
        clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
      }

      .app-screen {
        width: 100%;
        max-width: 600px;
        z-index: 20;
        display: none;
        flex-direction: column;
        opacity: 0;
        transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .app-screen.active {
        display: flex;
        opacity: 1;
      }

      /* ========================================================= */
      /* MENU INICIAL TECNOLÓGICO (HIGH-TECH CARDS)                */
      /* ========================================================= */
      .menu-list {
        display: flex;
        flex-direction: column;
        gap: 20px;
        width: 100%;
        padding-bottom: 30px;
      }

      .menu-item {
        background: linear-gradient(
          135deg,
          rgba(20, 20, 28, 0.85) 0%,
          rgba(8, 8, 12, 0.95) 100%
        );
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--card-border);
        border-left: 6px solid var(--primary);
        padding: 24px 22px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        position: relative;
        overflow: hidden;
        clip-path: polygon(
          0 0,
          100% 0,
          100% calc(100% - 15px),
          calc(100% - 15px) 100%,
          0 100%
        );
        box-shadow:
          0 10px 40px rgba(0, 0, 0, 0.8),
          inset 0 1px 1px rgba(255, 255, 255, 0.1);
        opacity: 0;
        transform: translateY(30px);
        animation: slideUp 0.6s forwards ease-out;
      }

      @keyframes slideUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Barra de dados lateral estilo Sci-Fi */
      .menu-item::before {
        content: "SYS.DATA // 88.X";
        position: absolute;
        top: 50%;
        left: -30px;
        transform: translateY(-50%) rotate(-90deg);
        font-family: "Teko", sans-serif;
        font-size: 10px;
        color: rgba(255, 255, 255, 0.1);
        letter-spacing: 2px;
      }

      .menu-item::after {
        content: "";
        position: absolute;
        right: 0;
        bottom: 0;
        width: 15px;
        height: 15px;
        background: var(--cyan);
        box-shadow: 0 0 15px var(--cyan-glow);
        clip-path: polygon(100% 0, 0 100%, 100% 100%);
      }

      .menu-item:hover,
      .menu-item:active {
        background: linear-gradient(
          135deg,
          rgba(25, 25, 35, 0.95) 0%,
          rgba(12, 12, 18, 1) 100%
        );
        border-color: rgba(0, 243, 255, 0.6);
        border-left-color: var(--cyan);
        transform: translateY(-5px) scale(1.02);
        box-shadow:
          0 20px 50px rgba(0, 243, 255, 0.15),
          inset 0 0 25px rgba(0, 243, 255, 0.1);
      }

      .menu-info {
        display: flex;
        flex-direction: column;
        gap: 8px;
        position: relative;
        z-index: 2;
        padding-left: 15px;
      }
      .menu-day-name {
        font-family: "Teko", sans-serif;
        font-size: 38px;
        color: #ffffff;
        letter-spacing: 2px;
        line-height: 1;
        text-transform: uppercase;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
      }

      .menu-tags {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 4px;
      }

      .menu-region-badge {
        font-size: 10px;
        font-weight: 900;
        text-transform: uppercase;
        background: rgba(255, 0, 60, 0.15);
        color: #ff4d73;
        padding: 6px 12px;
        border-radius: 2px;
        border: 1px solid rgba(255, 0, 60, 0.4);
        letter-spacing: 1.5px;
        box-shadow: 0 0 10px rgba(255, 0, 60, 0.1);
      }

      .menu-ex-count {
        font-size: 10px;
        font-weight: 900;
        text-transform: uppercase;
        color: var(--cyan);
        background: rgba(0, 243, 255, 0.1);
        padding: 6px 12px;
        border-radius: 2px;
        border: 1px solid rgba(0, 243, 255, 0.3);
        letter-spacing: 1.5px;
        box-shadow: 0 0 10px rgba(0, 243, 255, 0.1);
      }

      .menu-action {
        width: 50px;
        height: 50px;
        border-radius: 8px;
        background: rgba(0, 243, 255, 0.05);
        border: 2px solid rgba(0, 243, 255, 0.15);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s;
        transform: rotate(45deg);
        position: relative;
      }

      .menu-item:hover .menu-action {
        background: rgba(0, 243, 255, 0.2);
        border-color: var(--cyan);
        box-shadow: 0 0 25px var(--cyan-glow);
      }

      .menu-chevron {
        color: var(--cyan);
        font-size: 20px;
        font-weight: 900;
        transition: all 0.3s;
        transform: rotate(-45deg);
        margin-left: 4px;
        margin-top: 2px;
      }
      .menu-item:hover .menu-chevron {
        color: #fff;
        text-shadow: 0 0 8px #fff;
      }

      /* ========================================================= */
      /* GAVETA DE TREINO (INTERNA)                                */
      /* ========================================================= */
      .workout-nav-bar {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 25px;
        border-bottom: 2px solid rgba(255, 255, 255, 0.05);
        padding-bottom: 20px;
        position: relative;
      }
      .workout-nav-bar::after {
        content: "";
        position: absolute;
        bottom: -2px;
        left: 0;
        width: 40%;
        height: 2px;
        background: var(--cyan);
        box-shadow: 0 0 15px var(--cyan-glow);
      }

      .btn-back {
        background: transparent;
        border: 1px solid var(--cyan);
        color: var(--cyan);
        padding: 10px 16px;
        border-radius: 4px;
        font-size: 13px;
        font-weight: 800;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: all 0.2s;
        text-transform: uppercase;
        letter-spacing: 2px;
        box-shadow: inset 0 0 10px rgba(0, 243, 255, 0.1);
      }
      .btn-back:hover {
        background: rgba(0, 243, 255, 0.1);
        box-shadow:
          0 0 15px var(--cyan-glow),
          inset 0 0 10px rgba(0, 243, 255, 0.3);
      }
      .btn-back:active {
        transform: scale(0.92);
      }

      .workout-title {
        font-family: "Teko", sans-serif;
        font-size: 40px;
        color: #fff;
        letter-spacing: 3px;
        line-height: 1;
        text-transform: uppercase;
        text-shadow: 0 2px 15px rgba(0, 0, 0, 1);
      }

      .workout-container {
        display: flex;
        flex-direction: column;
        gap: 24px;
        width: 100%;
        padding-bottom: 150px;
      }

      .cardio-card,
      .exercise-card {
        background: linear-gradient(
          180deg,
          rgba(20, 20, 25, 0.8) 0%,
          rgba(10, 10, 14, 0.9) 100%
        );
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 8px;
        padding: 24px 20px;
        backdrop-filter: blur(16px);
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8);
        position: relative;
        overflow: hidden;
      }

      /* Detalhe de fita zebrada/cuidado tático */
      .cardio-card::after {
        content: "";
        position: absolute;
        top: 0;
        right: 0;
        width: 60px;
        height: 4px;
        background: repeating-linear-gradient(
          45deg,
          var(--cyan),
          var(--cyan) 5px,
          transparent 5px,
          transparent 10px
        );
      }

      .cardio-card::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        height: 100%;
        width: 5px;
        background: var(--cyan);
        box-shadow: 0 0 20px var(--cyan-glow);
      }
      .cardio-header {
        font-family: "Teko", sans-serif;
        font-size: 30px;
        color: #fff;
        letter-spacing: 2px;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
        text-transform: uppercase;
      }
      .cardio-header span {
        color: var(--cyan);
        text-shadow: 0 0 10px var(--cyan-glow);
      }

      .cardio-inputs {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 15px;
      }
      .cardio-input-group {
        background: rgba(0, 0, 0, 0.8);
        border: 1px solid rgba(0, 243, 255, 0.2);
        border-radius: 4px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        position: relative;
      }
      /* Foco de mira nos cantos */
      .cardio-input-group::before {
        content: "";
        position: absolute;
        top: -1px;
        left: -1px;
        width: 8px;
        height: 8px;
        border-top: 2px solid var(--cyan);
        border-left: 2px solid var(--cyan);
      }
      .cardio-input-group::after {
        content: "";
        position: absolute;
        bottom: -1px;
        right: -1px;
        width: 8px;
        height: 8px;
        border-bottom: 2px solid var(--cyan);
        border-right: 2px solid var(--cyan);
      }

      .cardio-input-group label {
        font-size: 10px;
        color: var(--text-muted);
        text-transform: uppercase;
        font-weight: 800;
        margin-bottom: 8px;
        letter-spacing: 2px;
      }
      .cardio-input-group input {
        background: transparent;
        border: none;
        color: var(--cyan);
        font-size: 22px;
        font-weight: 900;
        width: 100%;
        outline: none;
        text-shadow: 0 0 8px rgba(0, 243, 255, 0.4);
      }

      .exercise-card {
        border-top: 3px solid rgba(255, 0, 60, 0.5);
        transition: all 0.3s;
        clip-path: polygon(
          0 0,
          100% 0,
          100% calc(100% - 15px),
          calc(100% - 15px) 100%,
          0 100%
        );
      }
      .exercise-card:hover {
        border-top-color: var(--primary);
        box-shadow: 0 15px 45px rgba(255, 0, 60, 0.15);
        transform: translateY(-2px);
      }

      .exercise-name {
        font-family: "Teko", sans-serif;
        font-size: 32px;
        letter-spacing: 2px;
        color: #ffffff;
        margin-bottom: 20px;
        padding-bottom: 15px;
        display: flex;
        align-items: center;
        text-transform: uppercase;
        position: relative;
      }
      .exercise-name::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 1px;
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.2),
          transparent
        );
      }
      .exercise-name::before {
        content: "";
        position: absolute;
        bottom: -1px;
        left: 0;
        width: 50px;
        height: 3px;
        background: var(--primary);
        box-shadow: 0 0 10px var(--primary-glow);
      }

      .btn-history {
        background: transparent;
        border: 1px solid rgba(255, 0, 60, 0.5);
        color: #fff;
        border-radius: 2px;
        padding: 8px 14px;
        font-size: 11px;
        cursor: pointer;
        margin-left: auto;
        transition: all 0.2s;
        font-weight: 900;
        display: flex;
        align-items: center;
        gap: 6px;
        letter-spacing: 1.5px;
      }
      .btn-history:hover {
        background: rgba(255, 0, 60, 0.15);
        box-shadow: 0 0 15px rgba(255, 0, 60, 0.3);
      }
      .btn-history:active {
        transform: scale(0.92);
        background: var(--primary);
        border-color: var(--primary);
      }

      .sets-header {
        display: grid;
        grid-template-columns: 32px 1fr 1fr 40px;
        gap: 10px;
        padding: 0 6px 12px 6px;
        margin-bottom: 12px;
        font-size: 10px;
        color: var(--text-muted);
        font-weight: 800;
        text-transform: uppercase;
        text-align: center;
        letter-spacing: 1.5px;
      }
      .sets-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .set-row {
        display: grid;
        grid-template-columns: 32px 1fr 1fr 40px;
        gap: 10px;
        align-items: center;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 10px 8px;
        border-radius: 4px;
        transition: all 0.3s ease;
        position: relative;
      }

      @keyframes cyber-flash {
        0% {
          background: rgba(0, 255, 102, 0.4);
          box-shadow: 0 0 25px rgba(0, 255, 102, 0.6);
        }
        100% {
          background: rgba(0, 255, 102, 0.08);
        }
      }
      .set-row.completed {
        animation: cyber-flash 0.5s ease-out forwards;
        border-color: rgba(0, 255, 102, 0.4);
        border-left: 4px solid var(--success);
      }

      .set-label {
        font-size: 13px;
        color: #fff;
        font-weight: 900;
        text-align: center;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
        padding: 8px 0;
        font-family: "Montserrat", sans-serif;
      }
      .set-row.completed .set-label {
        background: var(--success);
        color: #000;
        box-shadow: 0 0 15px var(--success-glow);
      }

      .control-group {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(15, 15, 20, 0.9);
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        overflow: hidden;
        box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.5);
      }
      .btn-adjust {
        background: linear-gradient(
          180deg,
          rgba(40, 40, 50, 1) 0%,
          rgba(20, 20, 30, 1) 100%
        );
        border: none;
        border-right: 1px solid rgba(0, 0, 0, 0.8);
        color: var(--text-muted);
        width: 34px;
        height: 42px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.1s;
      }
      .btn-adjust:last-child {
        border-right: none;
        border-left: 1px solid rgba(0, 0, 0, 0.8);
      }
      .btn-adjust:active {
        background: var(--cyan);
        color: #000;
        box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.5);
      }

      input.val-input {
        width: 100%;
        text-align: center;
        font-size: 18px;
        font-weight: 900;
        color: #ffffff;
        background: transparent;
        border: none;
        padding: 0;
        outline: none;
      }

      .check-btn {
        width: 40px;
        height: 40px;
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: linear-gradient(
          180deg,
          rgba(40, 40, 50, 0.8) 0%,
          rgba(10, 10, 15, 0.9) 100%
        );
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        color: transparent;
        font-size: 20px;
        font-weight: 900;
        margin: 0 auto;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      }
      .check-btn:active {
        transform: scale(0.85);
      }
      .check-btn.checked {
        background: var(--success);
        border-color: var(--success);
        color: #000;
        box-shadow: 0 0 20px var(--success-glow);
        transform: scale(1.05);
      }

      /* CRONÔMETRO ESTILO PAINEL LED ESTRUTURAL */
      #timerWrapper {
        width: 100%;
        margin: 20px 0;
      }
      .hardware-timer {
        background: linear-gradient(180deg, #1a1a24 0%, #0a0a0e 100%);
        border: 2px solid #2a2a35;
        border-top: 1px solid #3a3a45;
        border-bottom: 4px solid var(--primary);
        border-radius: 12px;
        padding: 16px 16px 24px 16px;
        box-shadow:
          inset 0 20px 40px rgba(0, 0, 0, 0.5),
          0 15px 40px rgba(0, 0, 0, 0.9);
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* Parafusos nos cantos do painel */
      .hardware-timer::before,
      .hardware-timer::after {
        content: "";
        position: absolute;
        top: 8px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #333;
        box-shadow:

        top: -50%;
        left: -50%;
        width: 200%;

        background: linear-gradient(

        font-size: 80px;

      let currentDay = null;
      let currentActiveExercise = "";
      let wakeLock = null;

      async function requestWakeLock() {
        try {
          if ("wakeLock" in navigator) {
            wakeLock = await navigator.wakeLock.request("screen");
          }
        } catch (err) {}
      }
      function releaseWakeLock() {
        if (wakeLock !== null) {
          wakeLock.release().then(() => {
            wakeLock = null;
          });
        }
      }

      function initApp() {
        const menuList = document.getElementById("menuList");
        menuList.innerHTML = "";

        Object.keys(workoutData).forEach((dayKey, index) => {
          const day = workoutData[dayKey];
          const exCount = day.exercises.length;
          const btn = document.createElement("div");
          btn.className = "menu-item";
          btn.style.animationDelay = `${index * 0.1}s`;
          btn.onclick = () => openDay(dayKey);

          btn.innerHTML = `
                    <div class="menu-info">
                        <span class="menu-day-name">${day.dayName}</span>
                        <div class="menu-tags">
                            <span class="menu-region-badge">${day.region}</span>
                            <span class="menu-ex-count">${exCount} TAREFAS</span>
                        </div>
                    </div>
                    <div class="menu-action">
                        <span class="menu-chevron">❯</span>
                    </div>
                `;
          menuList.appendChild(btn);
        });
      }

      function openDay(dayKey) {
        currentDay = dayKey;
        document.getElementById("mainHeader").style.display = "none";
        document.getElementById("homeScreen").classList.remove("active");

        setTimeout(() => {
          document.getElementById("homeScreen").style.display = "none";
          document.getElementById("workoutScreen").style.display = "flex";
          document.getElementById("bottomActions").style.display = "flex";
          document.getElementById("workoutTitleDisplay").innerText =
            workoutData[dayKey].dayName;
          renderWorkout(dayKey);

          void document.getElementById("workoutScreen").offsetWidth;
          document.getElementById("workoutScreen").classList.add("active");
        }, 300);
      }

      function goHome() {
        document.getElementById("workoutScreen").classList.remove("active");
        document.getElementById("bottomActions").style.display = "none";

        setTimeout(() => {
          document.getElementById("workoutScreen").style.display = "none";
          document.getElementById("mainHeader").style.display = "block";
          document.getElementById("homeScreen").style.display = "flex";

          void document.getElementById("homeScreen").offsetWidth;
          document.getElementById("homeScreen").classList.add("active");
          stopTimer();
        }, 300);
      }

      function renderWorkout(dayKey) {
        const container = document.getElementById("workoutView");
        const timerWrapper = document.getElementById("timerWrapper");

        container.appendChild(timerWrapper);
        timerWrapper.style.display = "none";
        container.innerHTML = "";

        const dayData = workoutData[dayKey];
        const savedTime =
          localStorage.getItem(`gym_6dias_${dayKey}_cardio_time`) ||
          dayData.cardio.time;
        const savedDist =
          localStorage.getItem(`gym_6dias_${dayKey}_cardio_dist`) ||
          dayData.cardio.dist;
        const savedKcal =
          localStorage.getItem(`gym_6dias_${dayKey}_cardio_kcal`) ||
          dayData.cardio.kcal;

        const cardioCard = document.createElement("div");
        cardioCard.className = "cardio-card";
        cardioCard.innerHTML = `
                <div class="cardio-header"><span>🔥 PROTOCOLO CARDIO</span></div>
                <div class="cardio-inputs">
                    <div class="cardio-input-group"><label>Tempo</label><input type="text" id="cardio_time" value="${savedTime}" oninput="saveCardio()"></div>
                    <div class="cardio-input-group"><label>Distância</label><input type="text" id="cardio_dist" value="${savedDist}" oninput="saveCardio()"></div>
                    <div class="cardio-input-group"><label>Calorias</label><input type="text" id="cardio_kcal" value="${savedKcal}" oninput="saveCardio()"></div>
                </div>
            `;
        container.appendChild(cardioCard);
        timerWrapper.style.display = "block";
        container.appendChild(timerWrapper);

        dayData.exercises.forEach((ex, exIdx) => {
          const card = document.createElement("div");
          card.className = "exercise-card";

          let setsHtml = `
                    <div class="sets-header">
                        <div>Série</div>
                        <div>Carga (KG)</div>
                        <div>Reps</div>
                        <div>OK</div>
                    </div>
                    <div class="sets-list">
                `;

          ex.sets.forEach((set, setIdx) => {
            const saved = JSON.parse(
              localStorage.getItem(
                `gym_6dias_${dayKey}_ex${exIdx}_set${setIdx}`,
              ),
            ) || { kg: set.kg, reps: set.reps, checked: false };

            setsHtml += `
                        <div class="set-row ${saved.checked ? "completed" : ""}" id="row_${exIdx}_${setIdx}">
                            <div class="set-label">${setIdx + 1}</div>
                            
                            <div class="control-group">
                                <button class="btn-adjust" onclick="updateVal(${exIdx}, ${setIdx}, 'kg', -5)">-</button>
                                <input type="number" class="val-input" id="kg_${exIdx}_${setIdx}" value="${saved.kg}" onchange="saveState(${exIdx}, ${setIdx})" step="0.5">
                                <button class="btn-adjust" onclick="updateVal(${exIdx}, ${setIdx}, 'kg', 5)">+</button>
                            </div>
                            
                            <div class="control-group">
                                <button class="btn-adjust" onclick="updateVal(${exIdx}, ${setIdx}, 'reps', -1)">-</button>
                                <input type="number" class="val-input" id="reps_${exIdx}_${setIdx}" value="${saved.reps}" onchange="saveState(${exIdx}, ${setIdx})">
                                <button class="btn-adjust" onclick="updateVal(${exIdx}, ${setIdx}, 'reps', 1)">+</button>
                            </div>
                            
                            <button class="check-btn ${saved.checked ? "checked" : ""}" id="check_${exIdx}_${setIdx}" onclick="toggleCheck(${exIdx}, ${setIdx})">✓</button>
                        </div>
                    `;
          });

          setsHtml += `</div>`;

          card.innerHTML = `
                    <div class="exercise-name">
                        ${ex.name}
                        <button class="btn-history" onclick="showHistory('${ex.name}')">📈 DATA LOG</button>
                    </div>
                    ${setsHtml}
                `;
          container.appendChild(card);
        });
      }

      function saveCardio() {
        localStorage.setItem(
          `gym_6dias_${currentDay}_cardio_time`,
          document.getElementById("cardio_time").value,
        );
        localStorage.setItem(
          `gym_6dias_${currentDay}_cardio_dist`,
          document.getElementById("cardio_dist").value,
        );
        localStorage.setItem(
          `gym_6dias_${currentDay}_cardio_kcal`,
          document.getElementById("cardio_kcal").value,
        );
      }

      function updateVal(exIdx, setIdx, field, delta) {
        const inputField = document.getElementById(
          `${field}_${exIdx}_${setIdx}`,
        );
        let val = parseFloat(inputField.value.replace(",", ".")) || 0;
        val += delta;
        if (val < 0) val = 0;
        inputField.value = parseFloat(val.toFixed(1));
        saveState(exIdx, setIdx);
      }

      function toggleCheck(exIdx, setIdx) {
        const checkBtn = document.getElementById(`check_${exIdx}_${setIdx}`);
        const row = document.getElementById(`row_${exIdx}_${setIdx}`);
        row.classList.remove("completed");
        void row.offsetWidth;
        checkBtn.classList.toggle("checked");

        if (checkBtn.classList.contains("checked")) {
          row.classList.add("completed");
          saveState(exIdx, setIdx);
          showToast("SÉRIE REGISTRADA", 1500);
        } else {
          saveState(exIdx, setIdx);
        }
      }

      function saveState(exIdx, setIdx) {
        const kg =
          parseFloat(
            document
              .getElementById(`kg_${exIdx}_${setIdx}`)
              .value.replace(",", "."),
          ) || 0;
        const reps =
          parseInt(document.getElementById(`reps_${exIdx}_${setIdx}`).value) ||
          0;
        const checked = document
          .getElementById(`check_${exIdx}_${setIdx}`)
          .classList.contains("checked");
        localStorage.setItem(
          `gym_6dias_${currentDay}_ex${exIdx}_set${setIdx}`,
          JSON.stringify({ kg, reps, checked }),
        );
      }

      function resetWorkout() {
        if (
          confirm(
            `Resetar registros de sistema para a sessão de ${workoutData[currentDay].dayName}?`,
          )
        ) {
          localStorage.removeItem(`gym_6dias_${currentDay}_cardio_time`);
          localStorage.removeItem(`gym_6dias_${currentDay}_cardio_dist`);
          localStorage.removeItem(`gym_6dias_${currentDay}_cardio_kcal`);
          workoutData[currentDay].exercises.forEach((ex, exIdx) => {
            ex.sets.forEach((set, setIdx) =>
              localStorage.removeItem(
                `gym_6dias_${currentDay}_ex${exIdx}_set${setIdx}`,
              ),
            );
          });
          renderWorkout(currentDay);
          showToast("SISTEMA RESETADO", 2000);
        }
      }

      function copyWorkoutReport() {
        let report = `*CYBERGYM LOG (${workoutData[currentDay].dayName.toUpperCase()})*\n\n🔥 *Cardio:* ${document.getElementById("cardio_time").value} | ${document.getElementById("cardio_dist").value} / ${document.getElementById("cardio_kcal").value}\n`;
        workoutData[currentDay].exercises.forEach((ex, exIdx) => {
          report += `\n* ${ex.name}:`;
          ex.sets.forEach((set, setIdx) => {
            const kgVal = document.getElementById(
              `kg_${exIdx}_${setIdx}`,
            ).value;
            const repVal = document.getElementById(
              `reps_${exIdx}_${setIdx}`,
            ).value;
            report += `\n  - Série ${setIdx + 1}: ${kgVal}kg x ${repVal} reps (OK)`;
          });
        });
        navigator.clipboard
          .writeText(report)
          .then(() => showToast("LOG COPIADO PARA TRANSFERÊNCIA!", 2200));
      }

      function saveWorkoutHistory() {
        const dateStr = new Date().toLocaleDateString("pt-BR");
        let savedCount = 0;

        workoutData[currentDay].exercises.forEach((ex, exIdx) => {
          let maxKg = 0;
          let isCompleted = false;

          ex.sets.forEach((set, setIdx) => {
            const saved = JSON.parse(
              localStorage.getItem(
                `gym_6dias_${currentDay}_ex${exIdx}_set${setIdx}`,
              ),
            );
            if (saved && saved.checked) {
              isCompleted = true;
              if (saved.kg > maxKg) maxKg = saved.kg;
            }
          });

          if (isCompleted) {
            let history =
              JSON.parse(localStorage.getItem(`gym_history_${ex.name}`)) || [];
            let todayEntry = history.find((entry) => entry.date === dateStr);

            if (todayEntry) {
              todayEntry.maxKg = Math.max(todayEntry.maxKg, maxKg);
            } else {
              history.push({ date: dateStr, maxKg: maxKg });
            }
            localStorage.setItem(
              `gym_history_${ex.name}`,
              JSON.stringify(history),
            );
            savedCount++;
          }
        });

        if (savedCount > 0) {
          showToast(
            `SESSÃO SALVA! ${savedCount} EXERCÍCIOS NO BANCO DE DADOS 📈`,
            3500,
          );
        } else {
          showToast("NENHUM DADO ENCONTRADO PARA SALVAR!", 3000);
        }
      }

      function showHistory(exName) {
        currentActiveExercise = exName;
        document.getElementById("historyTitle").innerText = exName;
        document.getElementById("manualKgInput").value = "";
        renderHistoryList(exName);
        document.getElementById("historyModal").classList.add("active");
      }

      function renderHistoryList(exName) {
        const history =
          JSON.parse(localStorage.getItem(`gym_history_${exName}`)) || [];
        const list = document.getElementById("historyList");
        list.innerHTML = "";

        if (history.length === 0) {
          list.innerHTML =
            '<div class="history-item empty">Sem registros de força encontrados no banco de dados.</div>';
        } else {
          [...history].reverse().forEach((entry) => {
            list.innerHTML += `<div class="history-item"><span>${entry.date}</span><span>${entry.maxKg} KG</span></div>`;
          });
        }
      }

      function addManualWeight() {
        const inputValue = document
          .getElementById("manualKgInput")
          .value.replace(",", ".");
        const val = parseFloat(inputValue);

        if (isNaN(val) || val <= 0) {
          showToast("ERRO: INSIRA UM VALOR VÁLIDO!", 2000);
          return;
        }

        const dateStr = new Date().toLocaleDateString("pt-BR");
        let history =
          JSON.parse(
            localStorage.getItem(`gym_history_${currentActiveExercise}`),
          ) || [];
        let todayEntry = history.find((entry) => entry.date === dateStr);

        if (todayEntry) {
          todayEntry.maxKg = Math.max(todayEntry.maxKg, val);
        } else {
          history.push({ date: dateStr, maxKg: val });
        }

        localStorage.setItem(
          `gym_history_${currentActiveExercise}`,
          JSON.stringify(history),
        );
        document.getElementById("manualKgInput").value = "";
        renderHistoryList(currentActiveExercise);
        showToast(`ATUALIZAÇÃO: ${val}KG GRAVADOS NO SISTEMA! 🚀`, 2200);
      }

      function closeHistory() {
        document.getElementById("historyModal").classList.remove("active");
      }

      function showToast(msg, duration = 2500) {
        const toast = document.getElementById("toast");
        toast.innerText = msg;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), duration);
      }

      let timerInterval;
      let endTime = 0;
      const bellSound = new Audio(
        "https://gfxsounds.com/wp-content/uploads/2021/07/Boxing-bell-ring-three-times.mp3",
      );
      bellSound.volume = 1.0;

      function startTimer(seconds) {
        bellSound.load();
        clearInterval(timerInterval);
        requestWakeLock();
        endTime = Date.now() + seconds * 1000;
        const display = document.getElementById("timerDisplay");
        display.classList.remove("alarm");
        timerInterval = setInterval(() => {
          const now = Date.now();
          const remaining = endTime - now;
          if (remaining <= 0) {
            clearInterval(timerInterval);
            document.getElementById("timerDisplay").innerText = "00:00:00";
            triggerAlarm();
          } else {
            const m = Math.floor(remaining / 60000)
              .toString()
              .padStart(2, "0");
            const s = Math.floor((remaining % 60000) / 1000)
              .toString()
              .padStart(2, "0");
            const ms = Math.floor((remaining % 1000) / 10)
              .toString()
              .padStart(2, "0");
            document.getElementById("timerDisplay").innerText =
              `${m}:${s}:${ms}`;
          }
        }, 16);
      }

      function stopTimer() {
        clearInterval(timerInterval);
        endTime = 0;
        document.getElementById("timerDisplay").innerText = "00:00:00";
        document.getElementById("timerDisplay").classList.remove("alarm");
        releaseWakeLock();
      }

      function triggerAlarm() {
        endTime = 0;
        const display = document.getElementById("timerDisplay");
        display.innerText = "00:00:00";
        display.classList.add("alarm");
        bellSound.play().catch((e) => console.log("Áudio bloqueado", e));
        if (navigator.vibrate) navigator.vibrate([500, 200, 500]);
        setTimeout(() => {
          display.classList.remove("alarm");
          releaseWakeLock();
        }, 3000);
      }

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          if (endTime > 0) {
            const now = Date.now();
            if (now >= endTime) {
              clearInterval(timerInterval);
              triggerAlarm();
            } else {
              requestWakeLock();
            }
          }
        }
      });

      window.onload = initApp;
    </script>
