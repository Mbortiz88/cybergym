<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Matheus Ortiz Fitness // CyberHUD v2.1</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Montserrat:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.cdnfonts.com/css/digital-7-mono"
      rel="stylesheet"
    />

    <style>
      :root {
        --primary: #00f0ff;
        --primary-deep: #0066ff;
        --primary-glow: rgba(0, 240, 255, 0.45);
        --primary-subtle: rgba(0, 240, 255, 0.12);
        --success: #00ff88;
        --success-glow: rgba(0, 255, 136, 0.4);
        --accent: #ffb800;
        --accent-glow: rgba(255, 184, 0, 0.35);
        --danger: #ff3b5c;
        --bg-dark: #04070d;
        --card-bg: linear-gradient(
          145deg,
          rgba(13, 22, 38, 0.88),
          rgba(6, 11, 20, 0.94)
        );
        --border: rgba(0, 240, 255, 0.14);
        --text: #f4f9ff;
        --muted: #7a8fa8;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Montserrat", sans-serif;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        width: 100%;
        min-height: 100vh;
        background-color: var(--bg-dark);
        color: var(--text);
        overflow-x: hidden;
      }

      body {
        background-image:
          radial-gradient(
            circle at 50% -10%,
            rgba(0, 240, 255, 0.18) 0%,
            rgba(0, 102, 255, 0.08) 40%,
            transparent 70%
          ),
          linear-gradient(rgba(4, 7, 13, 0.9), rgba(4, 7, 13, 0.97)),
          url("https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=1000&auto=format&fit=crop");
        background-size: cover;
        background-attachment: fixed;
        background-position: center;
        padding: env(safe-area-inset-top, 16px) 12px 90px 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .scanline {
        position: fixed;
        top: -10%;
        left: 0;
        width: 100%;
        height: 2px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--primary),
          transparent
        );
        box-shadow: 0 0 15px 2px var(--primary-glow);
        opacity: 0.3;
        animation: scan 8s linear infinite;
        pointer-events: none;
        z-index: 9999;
      }

      @keyframes scan {
        0% {
          top: -10%;
        }
        100% {
          top: 110%;
        }
      }

      @keyframes hudPulse {
        0%,
        100% {
          text-shadow: 0 0 12px var(--primary-glow);
        }
        50% {
          text-shadow: 0 0 4px rgba(0, 240, 255, 0.2);
        }
      }

      header {
        width: 100%;
        max-width: 500px;
        text-align: center;
        margin-bottom: 22px;
        padding-top: 10px;
        z-index: 20;
        position: relative;
      }

      .logo-container {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-bottom: 4px;
      }

      .dumbbell-icon {
        width: 30px;
        height: 30px;
        color: var(--primary);
        filter: drop-shadow(0 0 10px var(--primary-glow));
      }

      h1 {
        font-family: "Teko", sans-serif;
        font-size: 30px;
        letter-spacing: 2px;
        text-transform: uppercase;
        line-height: 1;
        animation: hudPulse 4s infinite;
      }

      h1 span {
        color: var(--primary);
      }

      .subtitle {
        font-size: 9px;
        letter-spacing: 3px;
        color: var(--muted);
        text-transform: uppercase;
        font-weight: 800;
      }

      .app-screen {
        width: 100%;
        max-width: 500px;
        z-index: 20;
        display: none;
        flex-direction: column;
        opacity: 0;
        transition: opacity 0.25s ease;
      }

      .app-screen.active {
        display: flex !important;
        opacity: 1 !important;
      }

      /* BOTTOM NAV HOME */
      .main-nav-container {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        background: rgba(5, 10, 18, 0.92);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-top: 1px solid var(--border);
        display: flex;
        justify-content: space-around;
        padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px));
        z-index: 9000;
        box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.85);
      }

      .nav-tab {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        color: var(--muted);
        flex: 1;
        transition: 0.25s;
        cursor: pointer;
      }

      .nav-tab.active {
        color: var(--primary);
        filter: drop-shadow(0 0 8px var(--primary-glow));
      }

      .nav-tab svg {
        width: 22px;
        height: 22px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
      }

      .nav-label {
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 1.5px;
      }

      /* MENU HOME */
      .menu-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 100%;
        padding-bottom: 30px;
      }

      .menu-item {
        background: var(--card-bg);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        transition: 0.25s;
        position: relative;
        overflow: hidden;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
      }

      .menu-item::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        height: 100%;
        width: 4px;
        background: linear-gradient(180deg, var(--primary), var(--primary-deep));
        box-shadow: 2px 0 12px var(--primary-glow);
      }

      .menu-item:hover,
      .menu-item:active {
        transform: translateY(-2px);
        border-color: rgba(0, 240, 255, 0.45);
        box-shadow: 0 12px 30px rgba(0, 240, 255, 0.14);
      }

      .menu-info {
        display: flex;
        flex-direction: column;
        gap: 7px;
        z-index: 2;
      }

      .menu-day-name {
        font-family: "Teko", sans-serif;
        font-size: 28px;
        line-height: 1;
        letter-spacing: 0.5px;
      }

      .menu-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .menu-region-badge {
        font-size: 8px;
        font-weight: 800;
        background: var(--primary-subtle);
        color: var(--primary);
        padding: 4px 8px;
        border-radius: 5px;
        border: 1px solid rgba(0, 240, 255, 0.3);
        letter-spacing: 0.5px;
      }

      .menu-ex-count {
        font-size: 8px;
        font-weight: 800;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.05);
        padding: 4px 8px;
        border-radius: 5px;
      }

      .menu-stretch-badge {
        font-size: 8px;
        font-weight: 800;
        background: rgba(255, 184, 0, 0.12);
        color: var(--accent);
        padding: 4px 8px;
        border-radius: 5px;
        border: 1px solid rgba(255, 184, 0, 0.3);
      }

      .menu-action {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: rgba(0, 240, 255, 0.06);
        border: 1px solid var(--border);
        display: flex;
        justify-content: center;
        align-items: center;
        transition: 0.3s;
        color: var(--primary);
        font-size: 14px;
        flex-shrink: 0;
      }

      .menu-item:hover .menu-action {
        background: rgba(0, 240, 255, 0.2);
        border-color: var(--primary);
        transform: translateX(3px);
      }

      /* STICKY HUD HEADER COM PROGRESSO */
      .workout-hud-header {
        position: sticky;
        top: 0;
        z-index: 90;
        background: rgba(4, 8, 16, 0.92);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px 12px;
        margin-bottom: 14px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.75);
      }

      .workout-nav-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 8px;
      }

      .workout-title-group {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .btn-back {
        background: rgba(0, 240, 255, 0.08);
        border: 1px solid rgba(0, 240, 255, 0.25);
        color: var(--primary);
        padding: 6px 10px;
        border-radius: 6px;
        font-size: 10px;
        font-weight: 800;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .workout-title {
        font-family: "Teko", sans-serif;
        font-size: 25px;
        color: #fff;
        text-shadow: 0 0 12px var(--primary-glow);
        line-height: 1;
      }

      .progress-badge {
        font-size: 10px;
        font-weight: 800;
        color: var(--primary);
        background: var(--primary-subtle);
        border: 1px solid rgba(0, 240, 255, 0.25);
        padding: 4px 8px;
        border-radius: 6px;
        letter-spacing: 0.5px;
      }

      .progress-badge.complete {
        color: var(--success);
        background: rgba(0, 255, 136, 0.12);
        border-color: rgba(0, 255, 136, 0.35);
      }

      .progress-track {
        width: 100%;
        height: 5px;
        background: rgba(255, 255, 255, 0.07);
        border-radius: 99px;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(
          90deg,
          var(--primary-deep),
          var(--primary),
          var(--success)
        );
        box-shadow: 0 0 10px var(--primary-glow);
        border-radius: 99px;
        transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      }

      /* CONTAINER DE EXERCÍCIOS */
      .workout-container {
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding-bottom: 195px;
      }

      .cardio-card,
      .exercise-card,
      .stretch-card {
        background: var(--card-bg);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
        position: relative;
        overflow: hidden;
      }

      .cardio-card::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        height: 100%;
        width: 3px;
        background: linear-gradient(180deg, var(--primary), var(--primary-deep));
        box-shadow: 0 0 12px var(--primary);
      }

      .stretch-card {
        border-color: rgba(255, 184, 0, 0.3);
      }

      .stretch-card::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        height: 100%;
        width: 3px;
        background: var(--accent);
        box-shadow: 0 0 12px var(--accent-glow);
      }

      .cardio-header,
      .stretch-header {
        font-family: "Teko", sans-serif;
        font-size: 20px;
        letter-spacing: 1px;
        display: flex;
        align-items: center;
        margin-bottom: 10px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        padding-bottom: 8px;
      }

      .cardio-header {
        color: var(--primary);
      }

      .stretch-header {
        color: var(--accent);
      }

      .exercise-header-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 10px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        padding-bottom: 8px;
      }

      .exercise-title-col {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .exercise-name {
        font-family: "Teko", sans-serif;
        font-size: 21px;
        color: #fff;
        letter-spacing: 0.8px;
        line-height: 1.05;
      }

      .exercise-actions-col {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 5px;
        flex-shrink: 0;
      }

      .pr-tag {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 9px;
        font-weight: 800;
        color: var(--primary);
        background: rgba(0, 240, 255, 0.08);
        border: 1px solid rgba(0, 240, 255, 0.2);
        padding: 2px 7px;
        border-radius: 4px;
        width: fit-content;
      }

      .pr-tag.empty {
        color: var(--muted);
        background: rgba(255, 255, 255, 0.03);
        border-color: rgba(255, 255, 255, 0.08);
      }

      /* BOTÃO E GAVETA DE IMAGEM ANATÔMICA */
      .btn-img-toggle {
        background: rgba(0, 102, 255, 0.16);
        border: 1px solid rgba(0, 240, 255, 0.35);
        color: #fff;
        border-radius: 6px;
        padding: 4px 8px;
        font-size: 9px;
        font-weight: 800;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        transition: 0.2s;
      }

      .btn-img-toggle.active {
        background: var(--primary);
        color: #020812;
        border-color: var(--primary);
        box-shadow: 0 0 10px var(--primary-glow);
      }

      .img-drawer {
        display: none;
        margin-bottom: 12px;
        background: rgba(2, 6, 13, 0.85);
        border: 1px solid rgba(0, 240, 255, 0.25);
        border-radius: 10px;
        padding: 10px;
        text-align: center;
        animation: fadeInDrawer 0.25s ease;
      }

      .img-drawer.open {
        display: block;
      }

      @keyframes fadeInDrawer {
        from {
          opacity: 0;
          transform: translateY(-6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .img-drawer img {
        max-width: 100%;
        max-height: 210px;
        border-radius: 8px;
        background: #ffffff;
        padding: 6px;
        object-fit: contain;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
      }

      .img-placeholder-msg {
        font-size: 10px;
        color: var(--muted);
        padding: 14px 8px;
        border: 1px dashed rgba(0, 240, 255, 0.25);
        border-radius: 8px;
        line-height: 1.4;
      }

      .img-placeholder-msg code {
        display: inline-block;
        margin-top: 4px;
        color: var(--primary);
        background: rgba(0, 240, 255, 0.08);
        padding: 2px 6px;
        border-radius: 4px;
        font-family: monospace;
      }

      .exercise-note {
        font-size: 11px;
        color: #c8d8eb;
        background: rgba(0, 240, 255, 0.07);
        border-left: 2px solid var(--primary);
        padding: 8px 10px;
        border-radius: 0 6px 6px 0;
        margin-bottom: 12px;
        line-height: 1.4;
      }

      .stretch-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .stretch-item {
        background: rgba(2, 5, 10, 0.55);
        border: 1px solid rgba(255, 184, 0, 0.12);
        border-radius: 8px;
        padding: 9px 10px;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .stretch-item-title {
        font-size: 12px;
        font-weight: 800;
        color: #fff;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 6px;
      }

      .stretch-badges-right {
        display: flex;
        align-items: center;
        gap: 5px;
        flex-shrink: 0;
      }

      .stretch-item-time {
        font-size: 10px;
        font-weight: 800;
        color: var(--accent);
        background: rgba(255, 184, 0, 0.14);
        padding: 2px 6px;
        border-radius: 4px;
        white-space: nowrap;
      }

      .btn-stretch-img {
        background: rgba(255, 184, 0, 0.16);
        border: 1px solid rgba(255, 184, 0, 0.35);
        color: var(--accent);
        border-radius: 4px;
        padding: 2px 6px;
        font-size: 9px;
        font-weight: 800;
        cursor: pointer;
      }

      .btn-stretch-img.active {
        background: var(--accent);
        color: #050508;
      }

      .stretch-item-desc {
        font-size: 10px;
        color: var(--muted);
        line-height: 1.35;
      }

      .cardio-inputs {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }

      .cardio-input-group {
        background: rgba(2, 5, 10, 0.6);
        border: 1px solid rgba(0, 240, 255, 0.12);
        border-radius: 8px;
        padding: 7px 8px;
      }

      .cardio-input-group label {
        font-size: 8px;
        color: var(--muted);
        font-weight: 800;
        display: block;
        margin-bottom: 2px;
        text-transform: uppercase;
      }

      .cardio-input-group input {
        background: transparent;
        border: none;
        color: #fff;
        font-size: 14px;
        font-weight: 800;
        width: 100%;
        outline: none;
      }

      .btn-history {
        background: rgba(0, 240, 255, 0.08);
        border: 1px solid rgba(0, 240, 255, 0.25);
        color: var(--primary);
        border-radius: 6px;
        padding: 4px 8px;
        font-size: 9px;
        font-weight: 800;
        cursor: pointer;
        transition: 0.2s;
      }

      .btn-history:active {
        transform: scale(0.96);
      }

      .sets-header,
      .set-row {
        display: grid;
        grid-template-columns: 28px 1fr 1fr 36px;
        gap: 6px;
        text-align: center;
      }

      .sets-header {
        font-size: 9px;
        color: var(--muted);
        font-weight: 800;
        padding: 0 4px 6px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .sets-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .set-row {
        background: rgba(2, 5, 10, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.05);
        padding: 6px 5px;
        border-radius: 9px;
        transition: 0.25s;
        align-items: center;
      }

      @keyframes glow-pulse {
        0% {
          box-shadow: 0 0 16px var(--success-glow);
          border-color: var(--success);
        }
        100% {
          box-shadow: 0 0 6px rgba(0, 255, 136, 0.18);
          border-color: rgba(0, 255, 136, 0.4);
        }
      }

      .set-row.completed {
        background: rgba(0, 255, 136, 0.07);
        animation: glow-pulse 0.45s forwards;
      }

      .set-label {
        font-size: 11px;
        color: var(--muted);
        font-weight: 800;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 5px;
        padding: 6px 0;
      }

      .set-row.completed .set-label {
        background: rgba(0, 255, 136, 0.16);
        color: var(--success);
      }

      .control-group {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(255, 255, 255, 0.03);
        border-radius: 7px;
        border: 1px solid rgba(0, 240, 255, 0.12);
      }

      .btn-adjust {
        background: transparent;
        border: none;
        color: var(--primary);
        width: 26px;
        height: 30px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
      }

      .btn-adjust:active {
        background: rgba(0, 240, 255, 0.15);
      }

      input.val-input {
        width: 100%;
        text-align: center;
        font-size: 14px;
        font-weight: 800;
        color: #fff;
        background: transparent;
        border: none;
        outline: none;
        -moz-appearance: textfield;
      }

      .check-btn {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        border: 1px solid rgba(0, 240, 255, 0.25);
        background: rgba(2, 5, 10, 0.75);
        color: transparent;
        cursor: pointer;
        transition: 0.25s;
        margin: 0 auto;
        font-size: 15px;
      }

      .check-btn.checked {
        background: var(--success);
        border-color: var(--success);
        color: #02120a;
        font-weight: 900;
        box-shadow: 0 0 14px var(--success-glow);
        transform: scale(1.04);
      }

      /* DOCK INFERIOR FLUTUANTE (TIMER + AÇÕES) */
      .floating-dock {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        background: rgba(4, 8, 16, 0.94);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-top: 1px solid var(--border);
        padding: 8px 12px calc(10px + env(safe-area-inset-bottom, 0px));
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        z-index: 100;
        box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.9);
      }

      .dock-inner {
        width: 100%;
        max-width: 500px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .mini-timer-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        background: rgba(2, 6, 13, 0.9);
        border: 1px solid rgba(0, 240, 255, 0.25);
        border-radius: 9px;
        padding: 6px 10px;
        box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.8);
      }

      .timer-display {
        font-family: "Digital-7 Mono", sans-serif;
        font-size: 28px;
        color: var(--primary);
        text-shadow: 0 0 10px var(--primary-glow);
        line-height: 1;
        letter-spacing: 1px;
        min-width: 88px;
      }

      .timer-display.running {

        gap: 4px;
        flex: 1;
        justify-content: flex-end;

        border-radius: 5px;

        background: var(--primary);
        color: #020812;
        font-weight: 700;
      }

        background: rgba(255, 59, 92, 0.12);
        border-color: rgba(255, 59, 92, 0.35);
        color: #ff6b84;
      }

        display: grid;
        grid-template-columns: 1fr 1fr 1.6fr;
        gap: 6px;

        padding: 9px 6px;
        border-radius: 7px;
        font-family: "Teko", sans-serif;

        letter-spacing: 0.5px;
        cursor: pointer;
        border: none;
        text-transform: uppercase;

        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(2, 5, 12, 0.88);
        backdrop-filter: blur(6px);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 100000;
        visibility: hidden;
        opacity: 0;
        transition: 0.25s;
      }

      .modal-overlay.active {
        visibility: visible;
        opacity: 1;
      }

      .modal-content {
        background: #0a1220;
        border: 1px solid rgba(0, 240, 255, 0.35);
        border-radius: 14px;
        width: 90%;
        max-width: 340px;
        padding: 18px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);

        align-items: center;
        border-bottom: 1px solid var(--border);

        font-size: 22px;
        color: var(--primary);
        line-height: 1;
      }

      .close-btn {

        color: var(--muted);

        cursor: pointer;
        line-height: 1;

      let currentDay = null;
      let currentEx = "";
      let wakeLock = null;

      async function requestWakeLock() {
        try {
          if ("wakeLock" in navigator) {
            wakeLock = await navigator.wakeLock.request("screen");
          }
        } catch (e) {}
      }

      function releaseWakeLock() {
        if (wakeLock) {
          wakeLock.release().then(() => (wakeLock = null));
        }
      }

      function getExercisePR(exName) {
        const h = JSON.parse(localStorage.getItem(`gh_${exName}`)) || [];
        if (!h.length) return null;
        return Math.max(...h.map((item) => Number(item.max) || 0));
      }

      function toggleImgDrawer(drawerId, btnEl) {
        const drawer = document.getElementById(drawerId);
        if (!drawer) return;
        drawer.classList.toggle("open");
        if (btnEl) {
          btnEl.classList.toggle("active");
        }
      }

      function handleImgError(imgEl, path) {
        const parent = imgEl.parentElement;
        parent.innerHTML = `<div class="img-placeholder-msg">Ilustração ainda não adicionada.<br>Salve o arquivo no GitHub em:<br><code>${path}</code></div>`;
      }

      function updateProgressHUD() {
        if (!currentDay) return;
        const d = workoutData[currentDay];
        let totalSets = 0;
        let doneSets = 0;

        d.exercises.forEach((ex, i) => {
          ex.sets.forEach((s, j) => {
            totalSets++;
            const btn = document.getElementById(`c_${i}_${j}`);
            if (btn && btn.classList.contains("checked")) {
              doneSets++;
            }
          });
        });

        const pct = totalSets > 0 ? Math.round((doneSets / totalSets) * 100) : 0;
        const badge = document.getElementById("progressBadge");
        const fill = document.getElementById("progressFill");

        badge.innerText = `${doneSets}/${totalSets} • ${pct}%`;
        fill.style.width = `${pct}%`;

        if (pct === 100 && totalSets > 0) {
          badge.classList.add("complete");
        } else {
          badge.classList.remove("complete");
        }
      }

      function initApp() {
        const list = document.getElementById("menuList");
        list.innerHTML = "";

        Object.keys(workoutData).forEach((k) => {
          const d = workoutData[k];
          const hasStretch = d.preStretch || d.postStretch;
          list.innerHTML += `
            <div class="menu-item" onclick="openDay('${k}')">
                <div class="menu-info">
                    <span class="menu-day-name">${d.dayName}</span>
                    <div class="menu-tags">
                        <span class="menu-region-badge">${d.region}</span>
                        <span class="menu-ex-count">${d.exercises.length} EXERCÍCIOS</span>
                        ${hasStretch ? '<span class="menu-stretch-badge">+ ELASTICIDADE CHUTES</span>' : ""}
                    </div>
                </div>
                <div class="menu-action">❯</div>
            </div>`;
        });
      }

      function switchMainTab(id) {
        document
          .querySelectorAll(".app-screen")
          .forEach((s) => s.classList.remove("active"));
        setTimeout(() => {
          document
            .querySelectorAll(".app-screen")
            .forEach((s) => (s.style.display = "none"));
          document.getElementById(id).style.display = "flex";
          setTimeout(
            () => document.getElementById(id).classList.add("active"),
            10,
          );
        }, 250);
      }

      function openDay(k) {
        currentDay = k;
        document.getElementById("mainHeader").style.display = "none";
        document.getElementById("mainNavContainer").style.display = "none";
        document.getElementById("homeScreen").classList.remove("active");

        setTimeout(() => {
          document.getElementById("homeScreen").style.display = "none";
          document.getElementById("workoutScreen").style.display = "flex";
          document.getElementById("floatingDock").style.display = "flex";
          document.getElementById("workoutTitleDisplay").innerText =
            workoutData[k].dayName;
          renderWorkout(k);
          updateProgressHUD();
          window.scrollTo({ top: 0, behavior: "instant" });
          setTimeout(
            () =>
              document.getElementById("workoutScreen").classList.add("active"),
            10,
          );
        }, 250);
      }

      function goHome() {
        document.getElementById("workoutScreen").classList.remove("active");
        document.getElementById("floatingDock").style.display = "none";

        setTimeout(() => {
          document.getElementById("workoutScreen").style.display = "none";
          document.getElementById("mainHeader").style.display = "block";
          document.getElementById("homeScreen").style.display = "flex";
          document.getElementById("mainNavContainer").style.display = "flex";
          setTimeout(
            () => document.getElementById("homeScreen").classList.add("active"),
            10,
          );
          stopTimer();
        }, 250);
      }

      function buildStretchCard(title, items, prefix) {
        let itemsHtml = items
          .map((st, idx) => {
            const drawerId = `st_img_${prefix}_${idx}`;
            const imgBtn = st.img
              ? `<button class="btn-stretch-img" onclick="toggleImgDrawer('${drawerId}', this)">👁️ VER</button>`
              : "";
            const imgDrawer = st.img
              ? `<div class="img-drawer" id="${drawerId}" style="margin-top:6px;margin-bottom:0;">
                   <img src="${st.img}" alt="${st.title}" loading="lazy" onerror="handleImgError(this, '${st.img}')" />
                 </div>`
              : "";

            return `
            <div class="stretch-item">
                <div class="stretch-item-title">
                    <span>${st.title}</span>
                    <div class="stretch-badges-right">
                        <span class="stretch-item-time">${st.time}</span>
                        ${imgBtn}
                    </div>
                </div>
                <div class="stretch-item-desc">${st.desc}</div>
                ${imgDrawer}
            </div>`;
          })
          .join("");

        return `
          <div class="stretch-card">
              <div class="stretch-header">${title}</div>
              <div class="stretch-list">${itemsHtml}</div>
          </div>`;
      }

      function renderWorkout(k) {
        const cont = document.getElementById("workoutView");
        cont.innerHTML = "";

        const d = workoutData[k];
        const t = localStorage.getItem(`g_${k}_c_t`) || d.cardio.time;
        const di = localStorage.getItem(`g_${k}_c_d`) || d.cardio.dist;
        const kc = localStorage.getItem(`g_${k}_c_k`) || d.cardio.kcal;

        cont.innerHTML += `
          <div class="cardio-card">
              <div class="cardio-header">⚡ AQUECIMENTO / CARDIO</div>
              <div class="cardio-inputs">
                  <div class="cardio-input-group">
                      <label>Tempo</label>
                      <input type="text" id="c_t" value="${t}" oninput="saveC()">
                  </div>
                  <div class="cardio-input-group">
                      <label>Distância</label>
                      <input type="text" id="c_d" value="${di}" oninput="saveC()">
                  </div>
                  <div class="cardio-input-group">
                      <label>Calorias</label>
                      <input type="text" id="c_k" value="${kc}" oninput="saveC()">
                  </div>
              </div>
          </div>`;

        if (d.preStretch && d.preStretch.length > 0) {
          cont.innerHTML += buildStretchCard(
            "🥋 MOBILIDADE PRÉ-TREINO (CHUTES)",
            d.preStretch,
            "pre",
          );
        }

        d.exercises.forEach((ex, i) => {
          const pr = getExercisePR(ex.name);
          const prHtml =
            pr && pr > 0
              ? `<span class="pr-tag" id="pr_badge_${i}">🏆 RECORDE: ${pr} KG</span>`
              : `<span class="pr-tag empty" id="pr_badge_${i}">SEM RECORDE SALVO</span>`;

          const drawerId = `ex_img_${i}`;
          const imgBtnHtml = ex.img
            ? `<button class="btn-img-toggle" onclick="toggleImgDrawer('${drawerId}', this)">👁️ EXECUÇÃO</button>`
            : "";

          const imgDrawerHtml = ex.img
            ? `<div class="img-drawer" id="${drawerId}">
                 <img src="${ex.img}" alt="${ex.name}" loading="lazy" onerror="handleImgError(this, '${ex.img}')" />
               </div>`
            : "";

          let noteHtml = ex.note
            ? `<div class="exercise-note">${ex.note}</div>`
            : "";

          let sHtml = `
            <div class="sets-header">
                <div>Série</div>
                <div>Carga (KG)</div>
                <div>Reps</div>
                <div>OK</div>
            </div>
            <div class="sets-list">`;

          ex.sets.forEach((set, j) => {
            const s = JSON.parse(
              localStorage.getItem(`g_${k}_e${i}_s${j}`),
            ) || { kg: set.kg, reps: set.reps, checked: false };

            sHtml += `
              <div class="set-row ${s.checked ? "completed" : ""}" id="row_${i}_${j}">
                  <div class="set-label">${j + 1}</div>
                  
                  <div class="control-group">
                      <button class="btn-adjust" onclick="uV(${i},${j},'kg',-1)">-</button>
                      <input type="number" class="val-input" id="k_${i}_${j}" value="${s.kg}" onchange="saveS(${i},${j})" step="1">
                      <button class="btn-adjust" onclick="uV(${i},${j},'kg',1)">+</button>
                  </div>
                  
                  <div class="control-group">
                      <button class="btn-adjust" onclick="uV(${i},${j},'rp',-1)">-</button>
                      <input type="number" class="val-input" id="r_${i}_${j}" value="${s.reps}" onchange="saveS(${i},${j})">
                      <button class="btn-adjust" onclick="uV(${i},${j},'rp',1)">+</button>
                  </div>
                  
                  <button class="check-btn ${s.checked ? "checked" : ""}" id="c_${i}_${j}" onclick="tC(${i},${j})">✓</button>
              </div>`;
          });
          sHtml += `</div>`;

          cont.innerHTML += `
            <div class="exercise-card">
                <div class="exercise-header-top">
                    <div class="exercise-title-col">
                        <div class="exercise-name">${ex.name}</div>
                        ${prHtml}
                    </div>
                    <div class="exercise-actions-col">
                        ${imgBtnHtml}
                        <button class="btn-history" onclick="showH('${ex.name}')">📈 HISTÓRICO</button>
                    </div>
                </div>
                ${imgDrawerHtml}
                ${noteHtml}
                ${sHtml}
            </div>`;
        });

        if (d.postStretch && d.postStretch.length > 0) {
          cont.innerHTML += buildStretchCard(
            "🥋 ELASTICIDADE PÓS-TREINO (TIMER 45s/60s ABAIXO)",
            d.postStretch,
            "post",
          );
        }
      }

      function saveC() {
        localStorage.setItem(
          `g_${currentDay}_c_t`,
          document.getElementById("c_t").value,
        );
        localStorage.setItem(
          `g_${currentDay}_c_d`,
          document.getElementById("c_d").value,
        );
        localStorage.setItem(
          `g_${currentDay}_c_k`,
          document.getElementById("c_k").value,
        );
      }

      function uV(i, j, f, d) {
        const inpt = document.getElementById(`${f[0]}_${i}_${j}`);
        let v = parseFloat(inpt.value.replace(",", ".")) || 0;
        v = Math.max(0, v + d);
        inpt.value = Number.isInteger(v) ? v : v.toFixed(1);
        saveS(i, j);
      }

      function tC(i, j) {
        const btn = document.getElementById(`c_${i}_${j}`);
        const row = document.getElementById(`row_${i}_${j}`);

        row.classList.remove("completed");
        void row.offsetWidth;

        btn.classList.toggle("checked");

        if (btn.classList.contains("checked")) {
          row.classList.add("completed");
          showToast("SÉRIE COMPUTADA ✓", 900);
        }
        saveS(i, j);
        updateProgressHUD();
      }

      function saveS(i, j) {
        const kg =
          parseFloat(
            document.getElementById(`k_${i}_${j}`).value.replace(",", "."),
          ) || 0;
        const reps =
          parseInt(document.getElementById(`r_${i}_${j}`).value) || 0;
        const chk = document
          .getElementById(`c_${i}_${j}`)
          .classList.contains("checked");
        localStorage.setItem(
          `g_${currentDay}_e${i}_s${j}`,
          JSON.stringify({ kg, reps, checked: chk }),
        );
      }

      function resetWorkout() {
        if (confirm(`Zerar dados de ${workoutData[currentDay].dayName}?`)) {
          localStorage.removeItem(`g_${currentDay}_c_t`);
          localStorage.removeItem(`g_${currentDay}_c_d`);
          localStorage.removeItem(`g_${currentDay}_c_k`);

          workoutData[currentDay].exercises.forEach((ex, i) => {
            ex.sets.forEach((s, j) => {
              localStorage.removeItem(`g_${currentDay}_e${i}_s${j}`);
            });
          });

          renderWorkout(currentDay);
          updateProgressHUD();
          showToast("DADOS ZERADOS!", 1500);
        }
      }

      function copyWorkoutReport() {
        let r = `*HUD CYBERGYM: ${workoutData[currentDay].dayName.toUpperCase()}*\n⚡ *Cardio:* ${document.getElementById("c_t").value} | ${document.getElementById("c_d").value} / ${document.getElementById("c_k").value}\n`;

        workoutData[currentDay].exercises.forEach((ex, i) => {
          r += `\n* ${ex.name}:`;
          ex.sets.forEach((s, j) => {
            const done = document
              .getElementById(`c_${i}_${j}`)
              .classList.contains("checked")
              ? "✓"
              : "○";
            r += `\n  - S${j + 1}: ${document.getElementById(`k_${i}_${j}`).value}kg x ${document.getElementById(`r_${i}_${j}`).value} (${done})`;
          });
        });

        navigator.clipboard
          .writeText(r)
          .then(() => showToast("RELATÓRIO COPIADO!", 2000));
      }

      function saveWorkoutHistory() {
        const date = new Date().toLocaleDateString("pt-BR");
        let count = 0;

        workoutData[currentDay].exercises.forEach((ex, i) => {
          let max = 0,
            ok = false;

          ex.sets.forEach((s, j) => {
            const d = JSON.parse(
              localStorage.getItem(`g_${currentDay}_e${i}_s${j}`),
            );
            if (d && d.checked) {
              ok = true;
              if (d.kg > max) max = d.kg;
            }
          });

          if (ok) {
            let h = JSON.parse(localStorage.getItem(`gh_${ex.name}`)) || [];
            let t = h.find((e) => e.date === date);

            if (t) {
              t.max = Math.max(t.max, max);
            } else {
              h.push({ date: date, max: max });
            }

            localStorage.setItem(`gh_${ex.name}`, JSON.stringify(h));

            const newPR = getExercisePR(ex.name);
            const prBadge = document.getElementById(`pr_badge_${i}`);
            if (prBadge && newPR > 0) {
              prBadge.classList.remove("empty");
              prBadge.innerText = `🏆 RECORDE: ${newPR} KG`;
            }

            count++;
          }
        });

        if (count > 0) {
          showToast(`SALVO! ${count} REGISTROS ATUALIZADOS 🚀`, 3000);
        } else {
          showToast("MARQUE AO MENOS UMA SÉRIE PARA SALVAR", 2500);
        }
      }

      function showH(name) {
        currentEx = name;
        document.getElementById("historyTitle").innerText = name;
        document.getElementById("manualKgInput").value = "";

        const h = JSON.parse(localStorage.getItem(`gh_${name}`)) || [];
        const list = document.getElementById("historyList");
        list.innerHTML = "";

        if (!h.length) {
          list.innerHTML =
            '<div class="history-item" style="justify-content:center;color:#7a8fa8;">Sem registros ainda</div>';
        } else {
          [...h].reverse().forEach((e) => {
            list.innerHTML += `<div class="history-item"><span>${e.date}</span><span>${e.max} KG</span></div>`;
          });
        }

        document.getElementById("historyModal").classList.add("active");
      }

      function addManualWeight() {
        const v = parseFloat(
          document.getElementById("manualKgInput").value.replace(",", "."),
        );
        if (isNaN(v) || v <= 0) {
          showToast("VALOR INVÁLIDO!", 1500);
          return;
        }

        const date = new Date().toLocaleDateString("pt-BR");
        let h = JSON.parse(localStorage.getItem(`gh_${currentEx}`)) || [];
        let t = h.find((e) => e.date === date);

        if (t) {
          t.max = Math.max(t.max, v);
        } else {
          h.push({ date: date, max: v });
        }

        localStorage.setItem(`gh_${currentEx}`, JSON.stringify(h));
        showToast(`CARGA DE ${v}KG GRAVADA!`, 2000);
        showH(currentEx);

        if (currentDay) {
          const idx = workoutData[currentDay].exercises.findIndex(
            (e) => e.name === currentEx,
          );
          if (idx !== -1) {
            const newPR = getExercisePR(currentEx);
            const prBadge = document.getElementById(`pr_badge_${idx}`);
            if (prBadge && newPR > 0) {
              prBadge.classList.remove("empty");
              prBadge.innerText = `🏆 RECORDE: ${newPR} KG`;
            }
          }
        }
      }

      function closeHistory() {
        document.getElementById("historyModal").classList.remove("active");
      }

      function showToast(m, d) {
        const t = document.getElementById("toast");
        t.innerText = m;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), d);
      }

      let tmr;
      let end = 0;
      const bell = new Audio(
        "https://gfxsounds.com/wp-content/uploads/2021/07/Boxing-bell-ring-three-times.mp3",
      );

      function startTimer(s) {
        bell.load();
        clearInterval(tmr);
        requestWakeLock();
        end = Date.now() + s * 1000;
        const disp = document.getElementById("timerDisplay");
        disp.classList.add("running");

        tmr = setInterval(() => {
          let r = end - Date.now();
          if (r <= 0) {
            clearInterval(tmr);
            disp.innerText = "00:00:00";
            disp.classList.remove("running");
            end = 0;
            bell.play().catch(() => {});
            if (navigator.vibrate) navigator.vibrate([500, 200, 500]);
            releaseWakeLock();
          } else {
            let m = Math.floor(r / 60000)
              .toString()
              .padStart(2, "0");
            let sc = Math.floor((r % 60000) / 1000)
              .toString()
              .padStart(2, "0");
            let ms = Math.floor((r % 1000) / 10)
              .toString()
              .padStart(2, "0");
            disp.innerText = `${m}:${sc}:${ms}`;
          }
        }, 16);
      }

      function stopTimer() {
        clearInterval(tmr);
        end = 0;
        const disp = document.getElementById("timerDisplay");
        disp.innerText = "00:00:00";
        disp.classList.remove("running");
        releaseWakeLock();
      }

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible" && end > 0) {
          if (Date.now() >= end) {
            clearInterval(tmr);
            stopTimer();
            bell.play().catch(() => {});
          } else {
            requestWakeLock();
          }
        }
      });

      window.onload = initApp;
    </script>
  </body>
</html>
