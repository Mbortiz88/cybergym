<!doctype html>
<html lang="pt-BR">

    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Matheus Ortiz Fitness" />
    <!-- Ícone gerado dinamicamente com as iniciais "MO" para evitar o erro do fundo preto no iOS -->
    <link
      rel="apple-touch-icon"
      href="https://ui-avatars.com/api/?name=MO&background=040406&color=ff1836&size=512&font-size=0.45&bold=true"
    />
    <link
      rel="icon"
      type="image/png"
      href="https://ui-avatars.com/api/?name=MO&background=040406&color=ff1836&size=512&font-size=0.45&bold=true"
    />
    <title>Matheus Ortiz Fitness // CyberGym OS</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Montserrat:wght@400;600;800&display=swap"
      rel="stylesheet"

    <style>
      :root {
        --primary: #ff1836;
        --primary-glow: rgba(255, 24, 54, 0.7);
        --success: #00ff66;
        --success-glow: rgba(0, 255, 102, 0.6);
        --bg-dark: #040406;
        --card-bg: rgba(12, 12, 18, 0.88);
        --border-color: rgba(255, 24, 54, 0.35);
        --text-main: #ffffff;
        --text-muted: #9494a0;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Montserrat", sans-serif;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        background-color: var(--bg-dark);
        background-image:
          radial-gradient(
            circle at 50% -20%,
            rgba(255, 24, 54, 0.25) 0%,
            transparent 70%
          ),
          linear-gradient(rgba(4, 4, 6, 0.94), rgba(4, 4, 6, 0.98)),
          url("https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=1000&auto=format&fit=crop");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        color: var(--text-main);
        padding: env(safe-area-inset-top, 20px) 12px 50px 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
      }

      body::after {
        content: " ";
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        background: linear-gradient(
          rgba(18, 16, 16, 0) 50%,
          rgba(0, 0, 0, 0.3) 50%
        );
        background-size: 100% 4px;
        z-index: 999;
        pointer-events: none;
        opacity: 0.25;
      }

      header {
        width: 100%;
        max-width: 500px;
        text-align: center;
        margin-bottom: 22px;
        padding-top: 12px;
      }

      .logo-container {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-bottom: 6px;
      }

      /* SVG do Haltere embutido para nunca mais quebrar a imagem */
      .dumbbell-icon {
        width: 42px;
        height: 42px;
        color: var(--primary);
        filter: drop-shadow(0 0 12px var(--primary-glow));
        animation: cyber-pulse 2s infinite alternate;
      }

      @keyframes cyber-pulse {
        0% {
          transform: scale(1);
          filter: drop-shadow(0 0 8px var(--primary));
        }
        100% {
          transform: scale(1.1);
          filter: drop-shadow(0 0 18px var(--primary));
        }
      }

      h1 {
        font-family: "Teko", sans-serif;
        font-size: 38px;
        letter-spacing: 2px;
        color: #fff;
        text-shadow: 0 0 18px var(--primary-glow);
        text-transform: uppercase;
        line-height: 1;
      }

      h1 span {
        color: var(--primary);
        text-shadow: 0 0 18px var(--primary);
      }

      .subtitle {
        font-size: 10px;
        letter-spacing: 5px;
        color: var(--text-muted);
        text-transform: uppercase;
        font-weight: 600;
      }

      .days-container {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        width: 100%;
        max-width: 500px;
        margin-bottom: 20px;
      }

      .day-btn {
        background: var(--card-bg);
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: var(--text-muted);
        padding: 10px 12px;
        border-radius: 10px;
        font-family: "Teko", sans-serif;
        font-size: 18px;
        letter-spacing: 1.5px;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        backdrop-filter: blur(10px);
        flex: 1 1 calc(31% - 8px);
        text-align: center;
        position: relative;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      }

      .day-btn.active {
        background: linear-gradient(135deg, var(--primary), #8a0014);
        color: #fff;
        border-color: #ff5c73;
        box-shadow: 0 0 22px var(--primary-glow);
        font-weight: 700;
        transform: translateY(-2px);
      }

      .workout-container {
        width: 100%;
        max-width: 500px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .cardio-card {
        background: var(--card-bg);
        border: 1px solid rgba(255, 24, 54, 0.4);
        border-radius: 14px;
        padding: 16px;
        backdrop-filter: blur(12px);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
        position: relative;
        overflow: hidden;
      }

      .cardio-card::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        height: 100%;
        width: 5px;
        background: var(--primary);
        box-shadow: 0 0 15px var(--primary);
      }

      .cardio-header {
        font-family: "Teko", sans-serif;
        font-size: 22px;
        color: #ff6b7d;
        letter-spacing: 1.5px;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .cardio-inputs {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
      }

      .cardio-input-group {
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 6px 8px;
        display: flex;
        flex-direction: column;
      }

      .cardio-input-group label {
        font-size: 9px;
        color: var(--text-muted);
        text-transform: uppercase;
        font-weight: 700;
        margin-bottom: 2px;
      }

      .cardio-input-group input {
        background: transparent;
        border: none;
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        width: 100%;
        outline: none;
      }

      .exercise-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 14px;
        padding: 16px;
        backdrop-filter: blur(12px);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
        transition: all 0.3s ease;
      }

      .exercise-name {
        font-family: "Teko", sans-serif;
        font-size: 26px;
        letter-spacing: 1.5px;
        color: #fff;
        margin-bottom: 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding-bottom: 6px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .exercise-name span {
        font-size: 11px;
        font-family: "Montserrat", sans-serif;
        color: var(--text-muted);
        background: rgba(255, 255, 255, 0.05);
        padding: 2px 8px;
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      .sets-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .set-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(0, 0, 0, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.06);
        padding: 10px 12px;
        border-radius: 10px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .set-row.completed {
        background: rgba(0, 255, 102, 0.09);
        border-color: rgba(0, 255, 102, 0.5);
        box-shadow:
          inset 0 0 20px rgba(0, 255, 102, 0.08),
          0 0 10px rgba(0, 255, 102, 0.15);
      }

      .set-label {
        font-family: "Teko", sans-serif;
        font-size: 20px;
        color: var(--text-muted);
        width: 32px;
        font-weight: 700;
      }

      .set-controls {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .control-group {
        display: flex;
        align-items: center;
        background: rgba(255, 255, 255, 0.04);
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .control-group span {
        font-size: 9px;
        color: #777;
        text-transform: uppercase;
        padding: 0 4px;
        font-weight: 700;
      }

      .btn-adjust {
        background: rgba(255, 255, 255, 0.08);
        border: none;
        color: #fff;
        width: 32px;
        height: 32px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.15s;
      }

      .btn-adjust:active {
        background: var(--primary);
        transform: scale(0.9);
      }

      .val-display {
        width: 36px;
        text-align: center;
        font-size: 14px;
        font-weight: 700;
        color: #fff;
      }

      .check-btn {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.2);
        background: transparent;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        color: transparent;
        font-size: 16px;
      }

      .check-btn.checked {
        background: var(--success);
        border-color: var(--success);
        color: #000;
        box-shadow: 0 0 18px var(--success-glow);
        font-weight: bold;
        transform: scale(1.08);
      }

      .actions-container {
        width: 100%;
        max-width: 500px;
        display: flex;
        gap: 12px;
        margin-top: 22px;
      }

      .action-btn {
        flex: 1;
        padding: 14px;
        border-radius: 12px;
        font-family: "Teko", sans-serif;
        font-size: 20px;
        letter-spacing: 1.5px;
        cursor: pointer;
        border: none;
        text-transform: uppercase;
        transition: all 0.25s ease;
      }

      .action-btn:active {
        transform: scale(0.97);
      }

      .btn-copy {
        background: linear-gradient(135deg, var(--primary), #8a0014);
        color: #fff;
        box-shadow: 0 6px 22px var(--primary-glow);
        border: 1px solid #ff5c73;
      }

      .btn-reset {
        background: rgba(255, 255, 255, 0.05);
        color: var(--text-muted);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      #toast {
        position: fixed;
        bottom: 30px;
        background: rgba(0, 255, 102, 0.95);
        color: #000;
        padding: 12px 24px;
        border-radius: 30px;
        font-weight: 700;
        font-size: 14px;
        box-shadow: 0 8px 25px var(--success-glow);
        transform: translateY(120px);
        transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        z-index: 1000;
        letter-spacing: 0.5px;
      }

      #toast.show {
        transform: translateY(0);
      }
    </style>
  </head>

      let currentDay = "TER";

      function initApp() {
        const daysMenu = document.getElementById("daysMenu");
        daysMenu.innerHTML = "";

        Object.keys(workoutData).forEach((dayKey) => {
          const btn = document.createElement("button");
          btn.className = `day-btn ${dayKey === currentDay ? "active" : ""}`;
          btn.innerText = workoutData[dayKey].name.split(" ")[0];
          btn.onclick = () => {
            currentDay = dayKey;
            initApp();
          };
          daysMenu.appendChild(btn);
        });

        renderWorkout();
      }

      function renderWorkout() {
        const container = document.getElementById("workoutView");
        container.innerHTML = "";

        const dayData = workoutData[currentDay];
        const cardioKeyTime = `gym_${currentDay}_cardio_time`;
        const cardioKeyDist = `gym_${currentDay}_cardio_dist`;
        const cardioKeyKcal = `gym_${currentDay}_cardio_kcal`;

        const savedTime =
          localStorage.getItem(cardioKeyTime) || dayData.cardio.time;
        const savedDist =
          localStorage.getItem(cardioKeyDist) || dayData.cardio.dist;
        const savedKcal =
          localStorage.getItem(cardioKeyKcal) || dayData.cardio.kcal;

        const cardioCard = document.createElement("div");
        cardioCard.className = "cardio-card";
        cardioCard.innerHTML = `
                <div class="cardio-header">
                    <span>🔥 CARDIO SESSION</span>
                </div>
                <div class="cardio-inputs">
                    <div class="cardio-input-group">
                        <label>Tempo</label>
                        <input type="text" id="cardio_time" value="${savedTime}" oninput="saveCardio()">
                    </div>
                    <div class="cardio-input-group">
                        <label>Distância</label>
                        <input type="text" id="cardio_dist" value="${savedDist}" oninput="saveCardio()">
                    </div>
                    <div class="cardio-input-group">
                        <label>Calorias</label>
                        <input type="text" id="cardio_kcal" value="${savedKcal}" oninput="saveCardio()">
                    </div>
                </div>
            `;
        container.appendChild(cardioCard);

        dayData.exercises.forEach((ex, exIdx) => {
          const card = document.createElement("div");
          card.className = "exercise-card";

          let setsHtml = "";
          ex.sets.forEach((set, setIdx) => {
            const storageKey = `gym_${currentDay}_ex${exIdx}_set${setIdx}`;
            const saved = JSON.parse(localStorage.getItem(storageKey)) || {
              kg: set.kg,
              reps: set.reps,
              checked: false,
            };

            setsHtml += `
                        <div class="set-row ${saved.checked ? "completed" : ""}" id="row_${exIdx}_${setIdx}">
                            <div class="set-label">S${setIdx + 1}</div>
                            
                            <div class="set-controls">
                                <div class="control-group">
                                    <span>KG</span>
                                    <button class="btn-adjust" onclick="updateVal(${exIdx}, ${setIdx}, 'kg', -5)">-</button>
                                    <div class="val-display" id="kg_${exIdx}_${setIdx}">${saved.kg}</div>
                                    <button class="btn-adjust" onclick="updateVal(${exIdx}, ${setIdx}, 'kg', 5)">+</button>
                                </div>

                                <div class="control-group">
                                    <span>REPS</span>
                                    <button class="btn-adjust" onclick="updateVal(${exIdx}, ${setIdx}, 'reps', -1)">-</button>
                                    <div class="val-display" id="reps_${exIdx}_${setIdx}">${saved.reps}</div>
                                    <button class="btn-adjust" onclick="updateVal(${exIdx}, ${setIdx}, 'reps', 1)">+</button>
                                </div>
                            </div>

                            <button class="check-btn ${saved.checked ? "checked" : ""}" id="check_${exIdx}_${setIdx}" onclick="toggleCheck(${exIdx}, ${setIdx})">✓</button>
                        </div>
                    `;
          });

          card.innerHTML = `
                    <div class="exercise-name">
                        ${ex.name}
                        <span>EX ${exIdx + 1}</span>
                    </div>
                    <div class="sets-list">${setsHtml}</div>
                `;
          container.appendChild(card);
        });
      }

      function saveCardio() {
        const time = document.getElementById("cardio_time").value;
        const dist = document.getElementById("cardio_dist").value;
        const kcal = document.getElementById("cardio_kcal").value;

        localStorage.setItem(`gym_${currentDay}_cardio_time`, time);
        localStorage.setItem(`gym_${currentDay}_cardio_dist`, dist);
        localStorage.setItem(`gym_${currentDay}_cardio_kcal`, kcal);
      }

      function updateVal(exIdx, setIdx, field, delta) {
        const display = document.getElementById(`${field}_${exIdx}_${setIdx}`);
        let val = parseInt(display.innerText) + delta;
        if (val < 0) val = 0;
        display.innerText = val;
        saveState(exIdx, setIdx);
      }

      function toggleCheck(exIdx, setIdx) {
        const checkBtn = document.getElementById(`check_${exIdx}_${setIdx}`);
        const row = document.getElementById(`row_${exIdx}_${setIdx}`);

        checkBtn.classList.toggle("checked");
        row.classList.toggle("completed");

        saveState(exIdx, setIdx);
      }

      function saveState(exIdx, setIdx) {
        const kg = parseInt(
          document.getElementById(`kg_${exIdx}_${setIdx}`).innerText,
        );
        const reps = parseInt(
          document.getElementById(`reps_${exIdx}_${setIdx}`).innerText,
        );
        const checked = document
          .getElementById(`check_${exIdx}_${setIdx}`)
          .classList.contains("checked");

        const storageKey = `gym_${currentDay}_ex${exIdx}_set${setIdx}`;
        localStorage.setItem(storageKey, JSON.stringify({ kg, reps, checked }));
      }

      function resetWorkout() {
        if (confirm("Deseja realmente reiniciar os registros deste dia?")) {
          const dayData = workoutData[currentDay];
          localStorage.removeItem(`gym_${currentDay}_cardio_time`);
          localStorage.removeItem(`gym_${currentDay}_cardio_dist`);
          localStorage.removeItem(`gym_${currentDay}_cardio_kcal`);

          dayData.exercises.forEach((ex, exIdx) => {
            ex.sets.forEach((set, setIdx) => {
              localStorage.removeItem(
                `gym_${currentDay}_ex${exIdx}_set${setIdx}`,
              );
            });
          });
          renderWorkout();
        }
      }

      function copyWorkoutReport() {
        const dayData = workoutData[currentDay];
        const time =
          localStorage.getItem(`gym_${currentDay}_cardio_time`) ||
          dayData.cardio.time;
        const dist =
          localStorage.getItem(`gym_${currentDay}_cardio_dist`) ||
          dayData.cardio.dist;
        const kcal =
          localStorage.getItem(`gym_${currentDay}_cardio_kcal`) ||
          dayData.cardio.kcal;

        let report = `*TREINO CYBERGYM (${dayData.name.split(" ")[0]})*\n\n🔥 *Cardio:* ${time} | ${dist} / ${kcal}\n`;

        dayData.exercises.forEach((ex, exIdx) => {
          report += `\n* ${ex.name}:`;
          ex.sets.forEach((set, setIdx) => {
            const kg = document.getElementById(
              `kg_${exIdx}_${setIdx}`,
            ).innerText;
            const reps = document.getElementById(
              `reps_${exIdx}_${setIdx}`,
            ).innerText;
            report += `\n  - Série ${setIdx + 1}: ${kg}kg x ${reps} reps (OK)`;
          });
        });

        navigator.clipboard
          .writeText(report)
          .then(() => {
            showToast();
          })
          .catch((err) => {
            console.error("Erro ao copiar", err);
          });
      }

      function showToast() {
        const toast = document.getElementById("toast");
        toast.classList.add("show");
        setTimeout(() => {
          toast.classList.remove("show");
        }, 2200);
      }

      window.onload = initApp;
    </script>
  </body>
</html>
