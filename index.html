<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Matheus Ortiz Fitness">
    
    <link rel="apple-touch-icon" href="icone.jpg?v=2">
    <link rel="icon" type="image/jpeg" href="icone.jpg?v=2">
    
    <title>Matheus Ortiz Fitness // CyberGym OS</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/digital-7-mono" rel="stylesheet">
    
    <style>
        :root {
            --primary: #ff1836;
            --primary-glow: rgba(255, 24, 54, 0.7);
            --success: #00ff66;
            --success-glow: rgba(0, 255, 102, 0.6);
            --bg-dark: #040406;
            --card-bg: rgba(12, 12, 18, 0.88);
            --border-color: rgba(255, 24, 54, 0.35);
            --text-main: #ffffff;
            --text-muted: #9494a0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% -20%, rgba(255, 24, 54, 0.25) 0%, transparent 70%),
                linear-gradient(rgba(4, 4, 6, 0.94), rgba(4, 4, 6, 0.98)), 
                url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=1000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            padding: env(safe-area-inset-top, 20px) 12px 50px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* 1. TEXTURA CRT FIXA (Linhas de Monitor Antigo) */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(0, 0, 0, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
            background-size: 100% 4px;
            z-index: 9998;
            pointer-events: none;
        }

        /* 2. FEIXE DE VARREDURA HOLOGRÁFICO (Barra Scanner) */
        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: -20vh; left: 0; right: 0; height: 15vh;
            background: linear-gradient(to bottom, rgba(255,24,54,0) 0%, rgba(255,24,54,0.12) 50%, rgba(255,24,54,0) 100%);
            box-shadow: 0 0 20px rgba(255,24,54,0.05);
            z-index: 9999;
            pointer-events: none;
            animation: cyber-scan 6s linear infinite;
        }

        @keyframes cyber-scan {
            0% { transform: translateY(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(120vh); opacity: 0; }
        }

        header {
            width: 100%;
            max-width: 500px;
            text-align: center;
            margin-bottom: 22px;
            padding-top: 12px;
            z-index: 20;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 6px;
        }

        .dumbbell-icon {
            width: 42px;
            height: 42px;
            color: var(--primary);
            filter: drop-shadow(0 0 12px var(--primary-glow));
            animation: cyber-pulse 2s infinite alternate;
        }

        @keyframes cyber-pulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 8px var(--primary)); }
            100% { transform: scale(1.1); filter: drop-shadow(0 0 18px var(--primary)); }
        }

        /* GLITCH APRIMORADO COM SCREEN TEARING */
        h1 {
            font-family: 'Teko', sans-serif;
            font-size: 38px;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 18px var(--primary-glow);
            text-transform: uppercase;
            line-height: 1;
            position: relative;
            animation: glitch-anim 5s infinite;
        }

        @keyframes glitch-anim {
            0%, 9%, 11%, 19%, 21%, 69%, 71%, 100% { 
                transform: skew(0deg); 
                text-shadow: 0 0 18px var(--primary-glow); 
                clip-path: none; 
            }
            10% { 
                transform: skew(-10deg); 
                text-shadow: 4px 0 #0ff, -4px 0 #ff003c; 
                clip-path: inset(20% 0 60% 0); 
            }
            20% { 
                transform: skew(10deg); 
                text-shadow: -4px 0 #0ff, 4px 0 #ff003c; 
                clip-path: inset(70% 0 10% 0); 
            }
            70% { 
                transform: skew(0deg); 
                text-shadow: 2px 0 var(--success), -2px 0 var(--primary); 
                clip-path: inset(40% 0 40% 0); 
            }
        }

        h1 span {
            color: var(--primary);
            text-shadow: 0 0 18px var(--primary);
        }

        .subtitle {
            font-size: 10px;
            letter-spacing: 5px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
        }

        .days-container, .workout-container, .actions-container {
            width: 100%;
            max-width: 500px;
            z-index: 20;
        }

        .days-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .day-btn {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-muted);
            padding: 10px 12px;
            border-radius: 10px;
            font-family: 'Teko', sans-serif;
            font-size: 18px;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            flex: 1 1 calc(31% - 8px);
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .day-btn.active {
            background: linear-gradient(135deg, var(--primary), #8a0014);
            color: #fff;
            border-color: #ff5c73;
            box-shadow: 0 0 22px var(--primary-glow);
            font-weight: 700;
            transform: translateY(-2px);
        }

        .workout-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .cardio-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 24, 54, 0.4);
            border-radius: 14px;
            padding: 16px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            position: relative;
            overflow: hidden;
        }

        .cardio-card::before {
            content: '';
            position: absolute;
            left: 0; top: 0; height: 100%; width: 5px;
            background: var(--primary);
            box-shadow: 0 0 15px var(--primary);
        }

        .cardio-header {
            font-family: 'Teko', sans-serif;
            font-size: 22px;
            color: #ff6b7d;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
        }

        .cardio-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }

        .cardio-input-group {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 6px 8px;
            display: flex;
            flex-direction: column;
        }

        .cardio-input-group label {
            font-size: 9px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .cardio-input-group input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            width: 100%;
            outline: none;
        }

        #timerWrapper {
            width: 100%;
            margin: 5px 0;
            animation: fadeIn 0.4s ease-in-out;
        }

        .hardware-timer {
            background: #0a0a0c;
            border: 2px solid #222;
            border-radius: 10px;
            padding: 6px 8px 16px 8px; 
            box-shadow:
                inset 0 0 10px rgba(0,0,0,1),
                0 8px 25px rgba(0,0,0,0.8),
                0 1px 2px rgba(255,255,255,0.08);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hardware-screen {
            background: #060000;
            width: 100%;
            border-radius: 4px;
            padding: 8px 0; 
            border: 1px solid #1a0000;
            box-shadow: inset 0 0 15px rgba(0,0,0,1);
            text-align: center;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hardware-screen::before {
            content: "88:88:88";
            position: absolute;
            font-family: 'Digital-7 Mono', sans-serif;
            font-size: 58px; 
            color: #120000;
            z-index: 1;
            letter-spacing: 2px;
            pointer-events: none;
            user-select: none;
            line-height: 1;
        }

        .timer-display {
            font-family: 'Digital-7 Mono', sans-serif;
            font-size: 58px;
            color: #ff0a25;
            text-shadow: 0 0 6px #ff0a25, 0 0 15px #ff0a25;
            line-height: 1;
            letter-spacing: 2px;
            position: relative;
            z-index: 2;
        }

        .hardware-branding {
            position: absolute;
            bottom: 4px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 14px;
            font-family: 'Montserrat', sans-serif;
            font-size: 8px;
            color: #444;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .timer-controls-inline {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 10px;
            width: 100%;
        }

        .timer-btn-inline {
            flex: 1;
            background: rgba(30, 30, 36, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ccc;
            font-family: 'Teko', sans-serif;
            font-size: 16px;
            padding: 6px 0;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .timer-btn-inline:active {
            background: var(--primary);
            color: #fff;
            transform: scale(0.95);
        }

        .timer-btn-inline.stop {
            background: rgba(255, 24, 54, 0.1);
            color: #ff334b;
            border-color: rgba(255, 24, 54, 0.3);
        }

        @keyframes flash-timer {
            0% { opacity: 1; text-shadow: 0 0 10px #ff0a25, 0 0 30px #ff0a25; }
            50% { opacity: 0; }
            100% { opacity: 1; text-shadow: 0 0 10px #ff0a25, 0 0 30px #ff0a25; }
        }
        .timer-display.alarm {
            animation: flash-timer 0.3s 10;
        }

        .exercise-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
        }

        .exercise-name {
            font-family: 'Teko', sans-serif;
            font-size: 26px;
            letter-spacing: 1.5px;
            color: #fff;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .exercise-name span {
            font-size: 11px;
            font-family: 'Montserrat', sans-serif;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .sets-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .set-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 10px 12px;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        @keyframes cyber-flash {
            0% { background: rgba(0, 255, 102, 0.4); }
            100% { background: rgba(0, 255, 102, 0.09); }
        }

        .set-row.completed {
            animation: cyber-flash 0.6s ease-out forwards;
            border-color: rgba(0, 255, 102, 0.6);
            box-shadow: inset 0 0 20px rgba(0, 255, 102, 0.15), 0 0 15px rgba(0, 255, 102, 0.2);
        }

        .set-label {
            font-family: 'Teko', sans-serif;
            font-size: 20px;
            color: var(--text-muted);
            width: 32px;
            font-weight: 700;
        }

        .set-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-group {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .control-group span {
            font-size: 9px;
            color: #777;
            text-transform: uppercase;
            padding: 0 4px;
            font-weight: 700;
        }

        .btn-adjust {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: #fff;
            width: 32px;
            height: 32px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-adjust:active {
            background: var(--primary);
            transform: scale(0.9);
        }

        .val-display {
            width: 36px;
            text-align: center;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
        }

        .check-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            color: transparent;
            font-size: 16px;
        }

        .check-btn.checked {
            background: var(--success);
            border-color: var(--success);
            color: #000;
            box-shadow: 0 0 18px var(--success-glow);
            font-weight: bold;
            transform: scale(1.08);
        }

        .actions-container {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .action-btn {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            font-family: 'Teko', sans-serif;
            font-size: 20px;
            cursor: pointer;
            border: none;
            text-transform: uppercase;
            z-index: 20;
        }

        .btn-copy {
            background: linear-gradient(135deg, var(--primary), #8a0014);
            color: #fff;
            box-shadow: 0 6px 22px var(--primary-glow);
        }

        .btn-reset {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #toast {
            position: fixed;
            bottom: 40px;
            background: rgba(0, 255, 102, 0.95);
            color: #000;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 8px 25px var(--success-glow);
            transform: translateY(200px);
            transition: transform 0.3s ease;
            z-index: 10000;
        }

        #toast.show {
            transform: translateY(0);
        }
    </style>
</head>

                    { name: "Elevação Lateral", sets: [{kg: 0, reps: 12}, {kg: 0, reps: 12}] },
                    { name: "Rosca Direta", sets: [{kg: 0, reps: 10}, {kg: 0, reps: 10}] },
                    { name: "Abdominal Máquina", sets: [{kg: 40, reps: 15}, {kg: 45, reps: 12}, {kg: 45, reps: 12}] }
                ]
            },
            "EXT": {
                name: "EXTRA (POSTERIOR)",
                cardio: { time: "15min", dist: "1,5km", kcal: "120 Kcal" },
                exercises: [
                    { name: "Mesa Flexora", sets: [{kg: 0, reps: 12}, {kg: 0, reps: 12}, {kg: 0, reps: 12}, {kg: 0, reps: 10}] },
                    { name: "Stiff", sets: [{kg: 0, reps: 10}, {kg: 0, reps: 10}, {kg: 0, reps: 10}] },
                    { name: "Elevação Pélvica", sets: [{kg: 0, reps: 10}, {kg: 0, reps: 10}, {kg: 0, reps: 10}] },
                    { name: "Panturrilhas em Pé", sets: [{kg: 0, reps: 15}, {kg: 0, reps: 15}, {kg: 0, reps: 15}, {kg: 0, reps: 15}] }
                ]
            }
        };

        let currentDay = "TER";

        function initApp() {
            const daysMenu = document.getElementById('daysMenu');
            daysMenu.innerHTML = '';
            Object.keys(workoutData).forEach(dayKey => {
                const btn = document.createElement('button');
                btn.className = `day-btn ${dayKey === currentDay ? 'active' : ''}`;
                btn.innerText = workoutData[dayKey].name.split(' ')[0];
                btn.onclick = () => { currentDay = dayKey; initApp(); };
                daysMenu.appendChild(btn);
            });
            renderWorkout();
        }

        function renderWorkout() {
            const container = document.getElementById('workoutView');
            const timerWrapper = document.getElementById('timerWrapper');
            
            document.body.appendChild(timerWrapper);
            timerWrapper.style.display = 'none';
            
            container.innerHTML = '';
            const dayData = workoutData[currentDay];
            
            const savedTime = localStorage.getItem(`gym_${currentDay}_cardio_time`) || dayData.cardio.time;
            const savedDist = localStorage.getItem(`gym_${currentDay}_cardio_dist`) || dayData.cardio.dist;
            const savedKcal = localStorage.getItem(`gym_${currentDay}_cardio_kcal`) || dayData.cardio.kcal;

            const cardioCard = document.createElement('div');
            cardioCard.className = 'cardio-card';
            cardioCard.innerHTML = `
                <div class="cardio-header"><span>🔥 CARDIO SESSION</span></div>
                <div class="cardio-inputs">
                    <div class="cardio-input-group"><label>Tempo</label><input type="text" id="cardio_time" value="${savedTime}" oninput="saveCardio()"></div>
                    <div class="cardio-input-group"><label>Distância</label><input type="text" id="cardio_dist" value="${savedDist}" oninput="saveCardio()"></div>
                    <div class="cardio-input-group"><label>Calorias</label><input type="text" id="cardio_kcal" value="${savedKcal}" oninput="saveCardio()"></div>
                </div>
            `;
            container.appendChild(cardioCard);

            timerWrapper.style.display = 'block';
            container.appendChild(timerWrapper);

            dayData.exercises.forEach((ex, exIdx) => {
                const card = document.createElement('div');
                card.className = 'exercise-card';
                let setsHtml = '';
                ex.sets.forEach((set, setIdx) => {
                    const saved = JSON.parse(localStorage.getItem(`gym_${currentDay}_ex${exIdx}_set${setIdx}`)) || { kg: set.kg, reps: set.reps, checked: false };
                    setsHtml += `
                        <div class="set-row ${saved.checked ? 'completed' : ''}" id="row_${exIdx}_${setIdx}">
                            <div class="set-label">S${setIdx + 1}</div>
                            <div class="set-controls">
                                <div class="control-group">
                                    <span>KG</span><button class="btn-adjust" onclick="updateVal(${exIdx}, ${setIdx}, 'kg', -5)">-</button>
                                    <div class="val-display" id="kg_${exIdx}_${setIdx}">${saved.kg}</div>
                                    <button class="btn-adjust" onclick="updateVal(${exIdx}, ${setIdx}, 'kg', 5)">+</button>
                                </div>
                                <div class="control-group">
                                    <span>REPS</span><button class="btn-adjust" onclick="updateVal(${exIdx}, ${setIdx}, 'reps', -1)">-</button>
                                    <div class="val-display" id="reps_${exIdx}_${setIdx}">${saved.reps}</div>
                                    <button class="btn-adjust" onclick="updateVal(${exIdx}, ${setIdx}, 'reps', 1)">+</button>
                                </div>
                            </div>
                            <button class="check-btn ${saved.checked ? 'checked' : ''}" id="check_${exIdx}_${setIdx}" onclick="toggleCheck(${exIdx}, ${setIdx})">✓</button>
                        </div>
                    `;
                });
                card.innerHTML = `<div class="exercise-name">${ex.name}<span>EX ${exIdx + 1}</span></div><div class="sets-list">${setsHtml}</div>`;
                container.appendChild(card);
            });
        }

        function saveCardio() {
            localStorage.setItem(`gym_${currentDay}_cardio_time`, document.getElementById('cardio_time').value);
            localStorage.setItem(`gym_${currentDay}_cardio_dist`, document.getElementById('cardio_dist').value);
            localStorage.setItem(`gym_${currentDay}_cardio_kcal`, document.getElementById('cardio_kcal').value);
        }

        function updateVal(exIdx, setIdx, field, delta) {
            const display = document.getElementById(`${field}_${exIdx}_${setIdx}`);
            let val = parseInt(display.innerText) + delta;
            if (val < 0) val = 0;
            display.innerText = val;
            saveState(exIdx, setIdx);
        }

        function toggleCheck(exIdx, setIdx) {
            const checkBtn = document.getElementById(`check_${exIdx}_${setIdx}`);
            const row = document.getElementById(`row_${exIdx}_${setIdx}`);
            
            row.classList.remove('completed');
            void row.offsetWidth; 
            
            checkBtn.classList.toggle('checked');
            
            if (checkBtn.classList.contains('checked')) {
                row.classList.add('completed');
                saveState(exIdx, setIdx);
                
                startTimer(60);
                showToast("SÉRIE COMPUTADA // TIMER 60s INICIADO", 1500);
            } else {
                saveState(exIdx, setIdx);
            }
        }

        function saveState(exIdx, setIdx) {
            const kg = parseInt(document.getElementById(`kg_${exIdx}_${setIdx}`).innerText);
            const reps = parseInt(document.getElementById(`reps_${exIdx}_${setIdx}`).innerText);
            const checked = document.getElementById(`check_${exIdx}_${setIdx}`).classList.contains('checked');
            localStorage.setItem(`gym_${currentDay}_ex${exIdx}_set${setIdx}`, JSON.stringify({ kg, reps, checked }));
        }

        function resetWorkout() {
            if(confirm("Zerar registros de hoje?")) {
                localStorage.removeItem(`gym_${currentDay}_cardio_time`);
                localStorage.removeItem(`gym_${currentDay}_cardio_dist`);
                localStorage.removeItem(`gym_${currentDay}_cardio_kcal`);
                workoutData[currentDay].exercises.forEach((ex, exIdx) => {
                    ex.sets.forEach((set, setIdx) => localStorage.removeItem(`gym_${currentDay}_ex${exIdx}_set${setIdx}`));
                });
                renderWorkout();
            }
        }

        function copyWorkoutReport() {
            let report = `*TREINO CYBERGYM (${workoutData[currentDay].name.split(' ')[0]})*\n\n🔥 *Cardio:* ${document.getElementById('cardio_time').value} | ${document.getElementById('cardio_dist').value} / ${document.getElementById('cardio_kcal').value}\n`;
            workoutData[currentDay].exercises.forEach((ex, exIdx) => {
                report += `\n* ${ex.name}:`;
                ex.sets.forEach((set, setIdx) => {
                    report += `\n  - Série ${setIdx + 1}: ${document.getElementById(`kg_${exIdx}_${setIdx}`).innerText}kg x ${document.getElementById(`reps_${exIdx}_${setIdx}`).innerText} reps (OK)`;
                });
            });
            navigator.clipboard.writeText(report).then(() => showToast("RELATÓRIO COPIADO!", 2200));
        }

        function showToast(msg, duration = 2200) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), duration);
        }

        let timerInterval;
        let endTime = 0;
        
        const bellSound = new Audio('https://gfxsounds.com/wp-content/uploads/2021/07/Boxing-bell-ring-three-times.mp3');
        bellSound.volume = 1.0;

        function startTimer(seconds) {
            bellSound.load(); 
            clearInterval(timerInterval);
            
            endTime = Date.now() + (seconds * 1000);
            const display = document.getElementById('timerDisplay');
            display.classList.remove('alarm');

            timerInterval = setInterval(() => {
                const now = Date.now();
                const remaining = endTime - now;
                
                if (remaining <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('timerDisplay').innerText = "00:00:00";
                    triggerAlarm();
                } else {
                    const m = Math.floor(remaining / 60000).toString().padStart(2, '0');
                    const s = Math.floor((remaining % 60000) / 1000).toString().padStart(2, '0');
                    const ms = Math.floor((remaining % 1000) / 10).toString().padStart(2, '0'); 
                    document.getElementById('timerDisplay').innerText = `${m}:${s}:${ms}`;
                }
            }, 16); 
        }

        function stopTimer() {
            clearInterval(timerInterval);
            document.getElementById('timerDisplay').innerText = "00:00:00";
            document.getElementById('timerDisplay').classList.remove('alarm');
        }

        function triggerAlarm() {
            const display = document.getElementById('timerDisplay');
            display.innerText = "00:00:00";
            display.classList.add('alarm'); 
            
            bellSound.play().catch(e => console.log("Áudio bloqueado", e));
            if(navigator.vibrate) navigator.vibrate([500, 200, 500]);

            setTimeout(() => {
                display.classList.remove('alarm');
            }, 3000);
        }

        window.onload = initApp;
    </script>
</body>
</html>
