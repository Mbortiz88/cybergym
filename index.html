<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Matheus Ortiz Fitness // CyberHUD v2.1</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Montserrat:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.cdnfonts.com/css/digital-7-mono"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="scanline"></div>

    <header id="mainHeader">
      <div class="logo-container">
        <svg class="dumbbell-icon" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M20.5 8.5V15.5C20.5 16.3 19.8 17 19 17H18V19C18 19.6 17.6 20 17 20H15C14.4 20 14 19.6 14 19V15H10V19C10 19.6 9.6 20 9 20H7C6.4 20 6 19.6 6 19V17H5C4.2 17 3.5 16.3 3.5 15.5V8.5C3.5 7.7 4.2 7 5 7H6V5C6 4.4 6.4 4 7 4H9C9.6 4 10 4.4 10 5V9H14V5C14 4.4 14.4 4 15 4H17C17.6 4 18 4.4 18 5V7H19C19.8 7 20.5 7.7 20.5 8.5Z"
          />
        </svg>
        <h1>Matheus Ortiz <span>Fitness</span></h1>
      </div>
      <div class="subtitle">CyberHUD v2.1 // Electric Blue Edition</div>
    </header>

    <div id="homeScreen" class="app-screen active">
      <div class="menu-list" id="menuList"></div>
    </div>

    <div id="workoutScreen" class="app-screen">
      <div class="workout-hud-header">
        <div class="workout-nav-row">
          <div class="workout-title-group">
            <button class="btn-back" onclick="goHome()">
              <svg
                width="13"
                height="13"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="3"
              >
                <path d="M19 12H5M12 19l-7-7 7-7" />
              </svg>
              VOLTAR
            </button>
            <div class="workout-title" id="workoutTitleDisplay"></div>
          </div>
          <div class="progress-badge" id="progressBadge">0/0 • 0%</div>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <div class="workout-container" id="workoutView"></div>
    </div>

    <!-- DOCK INFERIOR FLUTUANTE COM TIMER + BOTÕES -->
    <div class="floating-dock" id="floatingDock">
      <div class="dock-inner">
        <div class="mini-timer-bar">
          <span class="timer-display" id="timerDisplay">00:00:00</span>
          <div class="timer-pills">
            <button class="timer-pill" onclick="startTimer(45)">45s</button>
            <button class="timer-pill" onclick="startTimer(60)">60s</button>
            <button class="timer-pill" onclick="startTimer(90)">90s</button>
            <button class="timer-pill" onclick="startTimer(120)">120s</button>
            <button class="timer-pill stop" onclick="stopTimer()">PARAR</button>
          </div>
        </div>
        <div class="actions-row">
          <button class="action-btn btn-reset" onclick="resetWorkout()">
            Zerar
          </button>
          <button class="action-btn btn-copy" onclick="copyWorkoutReport()">
            Copiar
          </button>
          <button class="action-btn btn-save" onclick="saveWorkoutHistory()">
            ✓ FINALIZAR TREINO
          </button>
        </div>
      </div>
    </div>

    <div class="main-nav-container" id="mainNavContainer">
      <div
        class="nav-tab active"
        id="tabTreinos"
        onclick="switchMainTab('homeScreen')"
      >
        <svg viewBox="0 0 24 24">
          <path
            d="M6.5 6.5v11m11-11v11m-13-9h14m-14 7h14m-3-11v14m-8-14v14"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <span class="nav-label">TREINOS</span>
      </div>
    </div>

    <div class="modal-overlay" id="historyModal">
      <div class="modal-content">
        <div class="modal-header">
          <div class="modal-title" id="historyTitle">Nome</div>
          <button class="close-btn" onclick="closeHistory()">×</button>
        </div>
        <div class="input-history-box">
          <label>Nova Carga Máxima (KG)</label>
          <div class="input-row-flex">
            <input
              type="number"
              id="manualKgInput"
              placeholder="Ex: 60"
              step="0.5"
            />
            <button class="btn-add-weight" onclick="addManualWeight()">
              SALVAR
            </button>
          </div>
        </div>
        <div class="history-list-title">Evolução de Cargas</div>
        <div class="history-list" id="historyList"></div>
      </div>
    </div>

    <div id="toast">MENSAGEM AQUI</div>

    <script src="script.js"></script>
  </body>
</html>
