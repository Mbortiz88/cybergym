<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Matheus Ortiz Fitness">
    <title>Matheus Ortiz Fitness // CyberGym</title>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff1e3c;
            --primary-glow: rgba(255, 30, 60, 0.6);
            --success: #00ff66;
            --success-glow: rgba(0, 255, 102, 0.5);
            --bg-dark: #070709;
            --card-bg: rgba(16, 16, 22, 0.85);
            --border-color: rgba(255, 30, 60, 0.25);
            --text-main: #ffffff;
            --text-muted: #8b8b9e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255, 30, 60, 0.12) 0%, transparent 60%),
                linear-gradient(rgba(7, 7, 9, 0.92), rgba(7, 7, 9, 0.96)), 
                url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=1000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            padding: env(safe-area-inset-top, 20px) 12px 50px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Efeito de Scanner Cyberpunk no Fundo */
        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 999;
            pointer-events: none;
            opacity: 0.3;
        }

        header {
            width: 100%;
            max-width: 500px;
            text-align: center;
            margin-bottom: 20px;
            padding-top: 10px;
            position: relative;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 6px;
        }

        .dumbbell-icon {
            font-size: 30px;
            filter: drop-shadow(0 0 12px var(--primary));
            animation: pulse-icon 2s infinite alternate;
        }

        @keyframes pulse-icon {
            0% { transform: scale(1); filter: drop-shadow(0 0 8px var(--primary)); }
            100% { transform: scale(1.1); filter: drop-shadow(0 0 18px var(--primary)); }
        }

        h1 {
            font-family: 'Teko', sans-serif;
            font-size: 36px;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 15px var(--primary-glow);
            text-transform: uppercase;
            line-height: 1;
        }

        h1 span {
            color: var(--primary);
        }

        .subtitle {
            font-size: 10px;
            letter-spacing: 4px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* Menu de Dias Futurista */
        .days-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            width: 100%;
            max-width: 500px;
            margin-bottom: 20px;
        }

        .day-btn {
            background: rgba(16, 16, 22, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-muted);
            padding: 10px 14px;
            border-radius: 8px;
            font-family: 'Teko', sans-serif;
            font-size: 18px;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(8px);
            flex: 1 1 calc(31% - 8px);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .day-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: 0.5s;
        }

        .day-btn:active::before {
            left: 100%;
        }

        .day-btn.active {
            background: linear-gradient(135deg, var(--primary), #b3001b);
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
            font-weight: 700;
            transform: translateY(-2px);
        }

        /* Container do Treino */
        .workout-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .cardio-box {
            background: var(--card-bg);
            border: 1px solid rgba(255, 100, 100, 0.3);
            border-radius: 12px;
            padding: 14px 18px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .cardio-box::after {
            content: '';
            position: absolute;
            left: 0; top: 0; height: 100%; width: 4px;
            background: #ff334b;
            box-shadow: 0 0 10px #ff334b;
        }

        .cardio-title {
            font-family: 'Teko', sans-serif;
            font-size: 22px;
            color: #ff5566;
            letter-spacing: 1.5px;
        }

        .cardio-stats {
            font-size: 13px;
            color: #fff;
            font-weight: 600;
            text-shadow: 0 0 8px rgba(255,255,255,0.3);
        }

        .exercise-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            transition: all 0.3s ease;
        }

        .exercise-name {
            font-family: 'Teko', sans-serif;
            font-size: 26px;
            letter-spacing: 1.5px;
            color: #fff;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .exercise-name span {
            font-size: 12px;
            font-family: 'Montserrat', sans-serif;
            color: var(--text-muted);
            background: rgba(255,255,255,0.05);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .sets-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .set-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 10px 12px;
            border-radius: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .set-row.completed {
            background: rgba(0, 255, 102, 0.08);
            border-color: rgba(0, 255, 102, 0.4);
            box-shadow: inset 0 0 15px rgba(0, 255, 102, 0.05);
        }

        .set-label {
            font-family: 'Teko', sans-serif;
            font-size: 20px;
            color: var(--text-muted);
            width: 32px;
            font-weight: 700;
        }

        .set-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-group {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .control-group span {
            font-size: 9px;
            color: #777;
            text-transform: uppercase;
            padding: 0 4px;
            font-weight: 700;
        }

        .btn-adjust {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: #fff;
            width: 30px;
            height: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
        }

        .btn-adjust:active {
            background: var(--primary);
            transform: scale(0.92);
        }

        .val-display {
            width: 34px;
            text-align: center;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
        }

        .check-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            color: transparent;
            font-size: 15px;
        }

        .check-btn.checked {
            background: var(--success);
            border-color: var(--success);
            color: #000;
            box-shadow: 0 0 15px var(--success-glow);
            font-weight: bold;
            transform: scale(1.05);
        }

        /* Botões de Ação Inferiores */
        .actions-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .action-btn {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            font-family: 'Teko', sans-serif;
            font-size: 20px;
            letter-spacing: 1.5px;
            cursor: pointer;
            border: none;
            text-transform: uppercase;
            transition: all 0.25s ease;
        }

        .action-btn:active {
            transform: scale(0.97);
        }

        .btn-copy {
            background: linear-gradient(135deg, var(--primary), #b3001b);
            color: #fff;
            box-shadow: 0 6px 20px var(--primary-glow);
        }

        .btn-reset {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Notificação Toast Tech */
        #toast {
            position: fixed;
            bottom: 30px;
            background: rgba(0, 255, 102, 0.95);
            color: #000;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 8px 25px var(--success-glow);
            transform: translateY(120px);
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            letter-spacing: 0.5px;
        }

        #toast.show {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <span class="dumbbell-icon">🏋️‍♂️</span>
            <h1>Matheus Ortiz <span>Fitness</span></h1>
        </div>
        <div class="subtitle">System OS // Performance Matrix</div>
    </header>

    <div class="days-container" id="daysMenu"></div>

    <div class="workout-container" id="workoutView"></div>

    <div class="actions-container">
        <button class="action-btn btn-reset" onclick="resetWorkout()">Zerar Dados</button>
        <button class="action-btn btn-copy" onclick="copyWorkoutReport()">Copiar Relatório</button>
    </div>

    <div id="toast">RELATÓRIO COPIADO COM SUCESSO!</div>

    <script>
        const workoutData = {
            "TER": {
                name: "TER (PUSH)",
                cardio: "🔥 Cardio: 20min | 2,5km / 160 Kcal",
                exercises: [
                    { name: "Supino Reto Barra", sets: [{kg: 60, reps: 10}, {kg: 65, reps: 8}, {kg: 65, reps: 8}] },
                    { name: "Supino Inclinado Halter", sets: [{kg: 55, reps: 10}, {kg: 60, reps: 8}, {kg: 60, reps: 8}] },
                    { name: "Desenvolvimento Máquina", sets: [{kg: 50, reps: 10}, {kg: 60, reps: 8}] },
                    { name: "Elevação Lateral", sets: [{kg: 15, reps: 10}, {kg: 10, reps: 10}, {kg: 10, reps: 8}, {kg: 10, reps: 8}] },
                    { name: "Peck Deck", sets: [{kg: 65, reps: 10}, {kg: 70, reps: 8}] },
                    { name: "Tríceps Corda", sets: [{kg: 60, reps: 10}, {kg: 65, reps: 8}, {kg: 70, reps: 8}] },
                    { name: "Tríceps Testa Polia", sets: [{kg: 40, reps: 10}, {kg: 45, reps: 8}] }
                ]
            },
            "QUA": {
                name: "QUA (PULL+BIC)",
                cardio: "🔥 Cardio: 15min | 1,2km / 100 Kcal",
                exercises: [
                    { name: "Puxada Alta", sets: [{kg: 40, reps: 10}, {kg: 45, reps: 8}, {kg: 50, reps: 8}] },
                    { name: "Remada Baixa / Serrote", sets: [{kg: 60, reps: 10}, {kg: 65, reps: 8}, {kg: 70, reps: 8}] },
                    { name: "Pulldown Corda", sets: [{kg: 50, reps: 10}, {kg: 55, reps: 10}] },
                    { name: "Crucifixo Inverso", sets: [{kg: 40, reps: 10}, {kg: 45, reps: 10}, {kg: 50, reps: 8}] },
                    { name: "Rosca Direta (W)", sets: [{kg: 30, reps: 10}, {kg: 35, reps: 10}, {kg: 35, reps: 8}] },
                    { name: "Rosca Scott Máquina", sets: [{kg: 40, reps: 10}, {kg: 45, reps: 8}, {kg: 50, reps: 8}] }
                ]
            },
            "QUI": {
                name: "QUI (LOWER)",
                cardio: "🔥 Cardio: 15min | 1,5km / 120 Kcal",
                exercises: [
                    { name: "Hack Squat", sets: [{kg: 0, reps: 10}, {kg: 0, reps: 10}, {kg: 0, reps: 10}] },
                    { name: "Leg Press 45º", sets: [{kg: 0, reps: 10}, {kg: 0, reps: 10}, {kg: 0, reps: 10}] },
                    { name: "Cadeira Extensora", sets: [{kg: 0, reps: 12}, {kg: 0, reps: 12}, {kg: 0, reps: 12}] },
                    { name: "Mesa Flexora", sets: [{kg: 0, reps: 12}, {kg: 0, reps: 12}, {kg: 0, reps: 12}] },
                    { name: "Elevação Pélvica", sets: [{kg: 0, reps: 10}, {kg: 0, reps: 10}] },
                    { name: "Panturrilhas em Pé", sets: [{kg: 0, reps: 15}, {kg: 0, reps: 15}, {kg: 0, reps: 15}] }
                ]
            },
            "SEX": {
                name: "SEX (UPPER+BIC)",
                cardio: "🔥 Cardio: 15min | 1,2km / 100 Kcal",
                exercises: [
                    { name: "Supino Reto", sets: [{kg: 0, reps: 10}, {kg: 0, reps: 10}, {kg: 0, reps: 10}] },
                    { name: "Remada Curvada", sets: [{kg: 0, reps: 10}, {kg: 0, reps: 10}, {kg: 0, reps: 10}] },
                    { name: "Desenvolvimento", sets: [{kg: 0, reps: 10}, {kg: 0, reps: 10}] },
                    { name: "Rosca Alternada", sets: [{kg: 0, reps: 10}, {kg: 0, reps: 10}, {kg: 0, reps: 10}] },
                    { name: "Tríceps Francês", sets: [{kg: 0, reps: 10}, {kg: 0, reps: 10}, {kg: 0, reps: 10}] }
                ]
            },
            "DOM": {
                name: "DOM (FULLBODY)",
                cardio: "🔥 Cardio: 20min | 2,0km / 150 Kcal",
                exercises: [
                    { name: "Leg Press", sets: [{kg: 0, reps: 10}, {kg: 0, reps: 10}, {kg: 0, reps: 10}] },
                    { name: "Supino Reto", sets: [{kg: 0, reps: 10}, {kg: 0, reps: 10}, {kg: 0, reps: 10}] },
                    { name: "Puxada Alta", sets: [{kg: 0, reps: 10}, {kg: 0, reps: 10}, {kg: 0, reps: 10}] },
                    { name: "Elevação Lateral", sets: [{kg: 0, reps: 12}, {kg: 0, reps: 12}] },
                    { name: "Rosca Direta", sets: [{kg: 0, reps: 10}, {kg: 0, reps: 10}] }
                ]
            }
        };

        let currentDay = "TER";

        function initApp() {
            const daysMenu = document.getElementById('daysMenu');
            daysMenu.innerHTML = '';

            Object.keys(workoutData).forEach(dayKey => {
                const btn = document.createElement('button');
                btn.className = `day-btn ${dayKey === currentDay ? 'active' : ''}`;
                btn.innerText = workoutData[dayKey].name.split(' ')[0];
                btn.onclick = () => {
                    currentDay = dayKey;
                    initApp();
                };
                daysMenu.appendChild(btn);
            });

            renderWorkout();
        }

        function renderWorkout() {
            const container = document.getElementById('workoutView');
            container.innerHTML = '';

            const dayData = workoutData[currentDay];

            const cardioBox = document.createElement('div');
            cardioBox.className = 'cardio-box';
            cardioBox.innerHTML = `
                <div class="cardio-title">CARDIO SESSION</div>
                <div class="cardio-stats">${dayData.cardio}</div>
            `;
            container.appendChild(cardioBox);

            dayData.exercises.forEach((ex, exIdx) => {
                const card = document.createElement('div');
                card.className = 'exercise-card';
                
                let setsHtml = '';
                ex.sets.forEach((set, setIdx) => {
                    const storageKey = `gym_${currentDay}_ex${exIdx}_set${setIdx}`;
                    const saved = JSON.parse(localStorage.getItem(storageKey)) || { kg: set.kg, reps: set.reps, checked: false };

                    setsHtml += `
                        <div class="set-row ${saved.checked ? 'completed' : ''}" id="row_${exIdx}_${setIdx}">
                            <div class="set-label">S${setIdx + 1}</div>
                            
                            <div class="set-controls">
                                <div class="control-group">
                                    <span>KG</span>
                                    <button class="btn-adjust" onclick="updateVal(${exIdx}, ${setIdx}, 'kg', -5)">-</button>
                                    <div class="val-display" id="kg_${exIdx}_${setIdx}">${saved.kg}</div>
                                    <button class="btn-adjust" onclick="updateVal(${exIdx}, ${setIdx}, 'kg', 5)">+</button>
                                </div>

                                <div class="control-group">
                                    <span>REPS</span>
                                    <button class="btn-adjust" onclick="updateVal(${exIdx}, ${setIdx}, 'reps', -1)">-</button>
                                    <div class="val-display" id="reps_${exIdx}_${setIdx}">${saved.reps}</div>
                                    <button class="btn-adjust" onclick="updateVal(${exIdx}, ${setIdx}, 'reps', 1)">+</button>
                                </div>
                            </div>

                            <button class="check-btn ${saved.checked ? 'checked' : ''}" id="check_${exIdx}_${setIdx}" onclick="toggleCheck(${exIdx}, ${setIdx})">✓</button>
                        </div>
                    `;
                });

                card.innerHTML = `
                    <div class="exercise-name">
                        ${ex.name}
                        <span>EX ${exIdx + 1}</span>
                    </div>
                    <div class="sets-list">${setsHtml}</div>
                `;
                container.appendChild(card);
            });
        }

        function updateVal(exIdx, setIdx, field, delta) {
            const display = document.getElementById(`${field}_${exIdx}_${setIdx}`);
            let val = parseInt(display.innerText) + delta;
            if (val < 0) val = 0;
            display.innerText = val;
            saveState(exIdx, setIdx);
        }

        function toggleCheck(exIdx, setIdx) {
            const checkBtn = document.getElementById(`check_${exIdx}_${setIdx}`);
            const row = document.getElementById(`row_${exIdx}_${setIdx}`);
            
            checkBtn.classList.toggle('checked');
            row.classList.toggle('completed');
            
            saveState(exIdx, setIdx);
        }

        function saveState(exIdx, setIdx) {
            const kg = parseInt(document.getElementById(`kg_${exIdx}_${setIdx}`).innerText);
            const reps = parseInt(document.getElementById(`reps_${exIdx}_${setIdx}`).innerText);
            const checked = document.getElementById(`check_${exIdx}_${setIdx}`).classList.contains('checked');

            const storageKey = `gym_${currentDay}_ex${exIdx}_set${setIdx}`;
            localStorage.setItem(storageKey, JSON.stringify({ kg, reps, checked }));
        }

        function resetWorkout() {
            if(confirm("Deseja realmente reiniciar os registros deste dia?")) {
                const dayData = workoutData[currentDay];
                dayData.exercises.forEach((ex, exIdx) => {
                    ex.sets.forEach((set, setIdx) => {
                        localStorage.removeItem(`gym_${currentDay}_ex${exIdx}_set${setIdx}`);
                    });
                });
                renderWorkout();
            }
        }

        function copyWorkoutReport() {
            const dayData = workoutData[currentDay];
            let report = `*TREINO CYBERGYM (${dayData.name.split(' ')[0]})*\n\n${dayData.cardio}\n`;

            dayData.exercises.forEach((ex, exIdx) => {
                report += `\n* ${ex.name}:`;
                ex.sets.forEach((set, setIdx) => {
                    const kg = document.getElementById(`kg_${exIdx}_${setIdx}`).innerText;
                    const reps = document.getElementById(`reps_${exIdx}_${setIdx}`).innerText;
                    report += `\n  - Série ${setIdx + 1}: ${kg}kg x ${reps} reps (OK)`;
                });
            });

            navigator.clipboard.writeText(report).then(() => {
                showToast();
            }).catch(err => {
                console.error('Erro ao copiar', err);
            });
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2200);
        }

        window.onload = initApp;
    </script>
</body>
</html>
